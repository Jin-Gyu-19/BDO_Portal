# ============================================================
#  Nginx 리버스 프록시 — 경로별 앱 라우팅 (v5 Portal 통합)
#  NAS 경로: /volume1/sh-pf/docker/sh-platform/nginx/default.conf
# ============================================================
#
#  [수정사항 - NAS 환경 적용]
#  - listen 8080 (network_mode: host 사용으로 직접 포트 리슨)
#  - upstream 127.0.0.1:8501 (host 네트워크에서 localhost로 Streamlit 접근)
#
#  접속 URL:
#    http://192.168.100.25:8080/            → SH Portal (메인 진입점)
#    http://192.168.100.25:8080/audit/      → SH Audit Platform (HTML v4, iframe용)
#    http://192.168.100.25:8080/ifrs18/     → K-IFRS 1118호 재무제표 분석기 (iframe용)
#    http://192.168.100.25:8080/data/       → Streamlit 데이터 구조화 앱
#    http://192.168.100.25:8080/health      → 헬스체크
# ============================================================

# ── Streamlit WebSocket 지원을 위한 upstream ──
upstream streamlit_app {
    server 127.0.0.1:8501;
}

server {
    listen 8080;
    server_name  _;

    # ── 헬스 체크 ──
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"sh-platform","version":"v5-portal"}';
        add_header Content-Type application/json;
    }

    # ── 루트: SH Portal (메인 진입점) ──
    location = / {
        root /usr/share/nginx/html/portal;
        index index.html;
    }

    # ── SH Audit Platform (HTML v4) — iframe으로 로딩됨 ──
    location /audit/ {
        alias /usr/share/nginx/html/audit/;
        index index.html;
        try_files $uri $uri/ /audit/index.html;
    }

    # ── K-IFRS 1118호 재무제표 분석기 — iframe으로 로딩됨 ──
    location /ifrs18/ {
        alias /usr/share/nginx/html/ifrs18/;
        index index.html;
        try_files $uri $uri/ /ifrs18/index.html;
    }

    # ── Streamlit 데이터 구조화 앱 ──
    location /data/ {
        proxy_pass http://streamlit_app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamlit WebSocket 지원 (필수)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # ── Streamlit 정적 파일 ──
    location /data/_stcore/ {
        proxy_pass http://streamlit_app/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── 업로드 파일 정적 서빙 ──
    location /uploads/ {
        alias /app/uploads/;
        autoindex off;
    }

    # ── 에러 페이지 ──
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        return 503 '<!DOCTYPE html><html><body style="font-family:sans-serif;text-align:center;padding:80px">
        <h1 style="color:#E81E25">503</h1>
        <p>서비스 점검 중입니다. 잠시 후 다시 시도해 주세요.</p>
        </body></html>';
        add_header Content-Type "text/html; charset=utf-8";
    }
}
