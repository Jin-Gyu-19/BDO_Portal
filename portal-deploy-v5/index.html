body[data-theme="dark"] .status .profile-bdo{border-right-color:rgba(203,213,225,.24)}
body[data-theme="dark"] .status .profile-bdo-mark{background:#cbd5e1}

/* 왼쪽 브랜드 — BDO 로고 + Portal */
.status .brand{display:flex;align-items:center;gap:9px;pointer-events:none}
.status .brand img{height:27px;width:auto;display:block;flex-shrink:0}
.status .brand span{font-size:calc(11.5px * var(--fz));font-weight:700;letter-spacing:-0.2px}
body[data-theme="dark"] .status .brand img{background:#fff;padding:3px 7px;border-radius:6px;height:32px}
body.phone .status .brand img{height:21px}
body.phone .status .brand span{font-size:calc(10px * var(--fz))}

/* 상태 표시줄 (조직명 + 프로필만) */

/* 사용자 프로필 — 상태 표시줄에 얹히는 형태 (배경 없이, hover는 확대만) */
.prof{display:flex;align-items:center;gap:6px;padding:2px 3px;margin-left:5px;
color:var(--fg);text-shadow:inherit;background:none;
transition:transform .17s cubic-bezier(.3,1.4,.5,1)}
.prof:hover,.prof.on{transform:scale(1.07)}
.prof:active{transform:scale(.97)}
.prof:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:8px}
.prof .av{width:24px;height:24px;border-radius:50%;background:linear-gradient(145deg,#FF5A72,var(--red));
color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;
flex-shrink:0;text-shadow:none}
.prof .nm{font-size:calc(11px * var(--fz));font-weight:700;letter-spacing:-0.08px}

/* 프로필 드롭다운 */
.pmenu{position:fixed;top:44px;right:16px;width:340px;z-index:950;border-radius:20px;corner-shape:squircle;padding:6px;
background:var(--menuBg);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
border:1px solid var(--menuBorder);box-shadow:var(--menuShadow);color:var(--fg);
opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top right;pointer-events:none;
transition:opacity .16s ease,transform .16s cubic-bezier(.2,.9,.3,1.1)}
.pmenu.on{opacity:1;transform:none;pointer-events:auto}
.pmenu .card{display:flex;align-items:center;gap:11px;padding:11px 11px 12px;border-bottom:1px solid var(--menuLine);
margin-bottom:5px}
.pmenu .card .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#FF5A72,var(--red));
color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.pmenu .card .n{font-size:calc(13.5px * var(--fz));font-weight:800;letter-spacing:-0.12px}
.pmenu .card .m{font-size:calc(10.5px * var(--fz));opacity:.6;margin-top:2px}
.pmenu .mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;
font-size:calc(12.5px * var(--fz));font-weight:600;color:var(--fg);text-align:left}
.pmenu .mi:hover{background:var(--menuHov)}
.pmenu .mi .ic{width:15px;height:15px;opacity:.6}
.pmenu .mi .n{margin-left:auto;font-size:calc(10.5px * var(--fz));font-weight:800;background:var(--red);color:#fff;
min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.pmenu .mi.out{color:var(--red)}
.pmenu .mi.out .ic{opacity:.85}
.pmenu .sep{height:1px;background:var(--menuLine);margin:5px 2px}
.pmenu .lbl{padding:6px 10px 5px;font-size:calc(9.5px * var(--fz));font-weight:800;letter-spacing:1.1px;opacity:.5;text-transform:uppercase}
.swatches{display:flex;gap:7px;padding:2px 8px 8px}
.sw{flex:1;height:38px;border-radius:10px;corner-shape:squircle;border:1.5px solid var(--menuLine);position:relative;overflow:hidden}
.sw span{position:absolute;left:4px;right:4px;bottom:4px;font-size:calc(8px * var(--fz));font-weight:800;color:#1C1C1E;
background:rgba(255,255,255,.82);border-radius:4px;padding:1px 3px;text-align:center;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw.dk span{color:#fff;background:rgba(0,0,0,.45)}
.sw.on{border-color:var(--red);box-shadow:0 0 0 2px rgba(232,26,59,.25)}

/* 토스트 */
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(10px);z-index:1500;
background:rgba(28,33,40,.9);color:#fff;font-size:calc(12px * var(--fz));font-weight:600;padding:9px 16px;border-radius:99px;
box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ══ 홈 화면 ══ */
.home{position:fixed;inset:var(--statusH) 0 var(--dockH);display:flex;flex-direction:column;gap:28px;
padding:0px 46px 0;z-index:10;transition:transform .38s cubic-bezier(.32,.72,0,1),opacity .3s,filter .38s}
.home.pushed{transform:scale(.968);opacity:.62;filter:blur(1.2px)}
.greet{flex-shrink:0;margin-top:-4px}
.greet h1{font-size:64px;font-weight:700;letter-spacing:-0.64px;text-shadow:var(--tshadow);
line-height:1.18;opacity:.74}
.greet h1 em{font-style:normal;font-weight:900;opacity:1;letter-spacing:-0.76px}
.greet h1 em .role{font-weight:800;font-size:.82em;letter-spacing:-0.32px;opacity:.86;margin-left:2px}
.greet h1 .tail{font-size:.82em}
.greet p{font-size:15px;opacity:.66;margin-top:7px;letter-spacing:-0.08px}
.greet .datechip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;color:var(--fg);
  opacity:.82;background:var(--chip);padding:5px 12px;border-radius:20px;margin-top:9px}
.greet .datechip .sun{width:15px;height:15px;flex:0 0 auto}

/* 홈 격자 — 아이콘과 위젯이 같은 칸을 쓴다 (경계 없음, 빈 칸은 빈 칸으로) */
.hgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols),1fr);
grid-template-rows:repeat(var(--rows),1fr);gap:16px}
.wg{border-radius:32px;corner-shape:squircle;padding:17px 19px;position:relative;overflow:hidden;cursor:pointer;color:var(--wgFg);
background:var(--wgBg);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
border:1px solid var(--wgBorder);box-shadow:var(--wgShadow);transition:transform .18s,background .3s,border-color .3s}
.wg:hover{transform:translateY(-2px)}
.wg{min-width:0;min-height:0;--fz:1.25}   /* 위젯은 칸 높이에 맞춰 1.25배 */
body.phone .wg{--fz:1.15}

/* 줄인 만큼 내용도 같이 줄어들도록 — 폭 비율에 맞춰 본문 전체를 축소 */
.wgc{width:calc(100% / var(--s,1));height:calc(100% / var(--s,1));
transform:scale(var(--s,1));transform-origin:top left;transition:transform .16s}
/* 폭이 줄어도 행 높이가 늘지 않도록 한 줄로 자른다 (그리드 칸이 글자 길이만큼 벌어지지 않게 min-width:0) */
.pitem .t,.pitem .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem>div,.nrow .t,.drow .t{min-width:0}

/* 글자 크기는 그대로 두고, 칸 높이에 들어가는 항목만 보여 준다 (JS fitWidgets) */
.wg .more{display:block;margin-top:11px;padding-top:10px;border-top:1px solid var(--wgTrack)}
.wg[data-r="1"] .plist{gap:7px;margin-top:8px}
.wg[data-r="1"] .nlist{gap:9px;margin-top:5px}
.wg[data-r="1"] .ring{margin-top:4px;gap:12px}
.wg[data-r="1"] .ring svg{width:52px;height:52px}
.wg[data-r="1"][data-c="1"] .ring{margin-top:2px;gap:6px}
.wg[data-r="1"][data-c="1"] .ring svg{width:34px;height:34px}
/* 1열 폭에서는 링과 수치를 세로로 쌓고 링을 줄인다 */
.wg[data-c="1"] .ring{flex-direction:column;align-items:flex-start;gap:9px;margin-top:10px}
.wg[data-c="1"] .ring svg{width:58px;height:58px}
.wg[data-c="1"] .ring .val{font-size:calc(22px * var(--fz))}
.wg[data-c="1"] .ring .lab{font-size:calc(10px * var(--fz));line-height:1.45}
.drow{display:flex;align-items:center;gap:9px;font-size:calc(11px * var(--fz));padding:4px 0}
.drow .dd{font-weight:800;font-size:calc(11px * var(--fz));opacity:.9;min-width:34px}
.drow .t{opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 크기 조정 핸들 */
.wg .rsz{position:absolute;right:7px;bottom:7px;width:22px;height:22px;border-radius:7px;
display:flex;align-items:center;justify-content:center;background:var(--rszBg);color:var(--wgFg);
opacity:0;transition:opacity .15s;cursor:nwse-resize;touch-action:none}
.wg:hover .rsz{opacity:.8}
.wg .rsz:hover{opacity:1}
.wg.deadline .rsz{color:#fff;background:rgba(255,255,255,.18)}
.wg .rsz svg{width:11px;height:11px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.wg .szl{position:absolute;right:8px;top:8px;font-size:calc(10px * var(--fz));font-weight:800;padding:3px 8px;border-radius:99px;
background:var(--rszBg);opacity:0;transition:opacity .15s}
.wg.rz .szl{opacity:1}
.wg.rz{transform:none;outline:2px solid var(--red);outline-offset:-2px}
.wg .hd{display:flex;align-items:center;gap:7px;font-size:calc(15px * var(--fz));font-weight:800;letter-spacing:-0.2px;opacity:.9;
white-space:nowrap;overflow:hidden}
.wg[data-c="1"] .hd .cnt,.wg[data-c="2"] .hd .cnt{display:none}   /* 좁은 위젯에서는 건수를 생략해 제목이 한 줄로 */
.wg .hd .sq{width:19px;height:19px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:7.5px;font-weight:900}
.wg.deadline{background:linear-gradient(150deg,#3A4956,#1A2530);color:#fff;
border-color:rgba(255,255,255,.13);box-shadow:0 10px 28px rgba(16,24,32,.24)}
.wg.deadline .big{color:#FFB454}
.wg.deadline .hd{opacity:.72}
.wg.deadline .cap b{color:#fff}
.wg.deadline .more{border-top-color:rgba(255,255,255,.16)}
.wg.deadline .drow .dd{color:#FFB454;opacity:1}
.wg .big{font-size:calc(36px * var(--fz));font-weight:800;letter-spacing:-0.8px;line-height:1;margin-top:10px}
.wg .big small{font-size:calc(13px * var(--fz));font-weight:700;opacity:.6;margin-left:3px;letter-spacing:0}
.wg .cap{font-size:calc(11.5px * var(--fz));opacity:.8;margin-top:7px;line-height:1.5}
.wg .cap b{font-weight:800;opacity:1}
.plist{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.pitem{display:grid;grid-template-columns:26px 1fr 38px;gap:10px;align-items:center}
.pitem .av{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.pitem .t{font-size:calc(11.5px * var(--fz));font-weight:700;letter-spacing:-0.08px}
.pitem .s{font-size:calc(9.5px * var(--fz));opacity:.6;margin-top:2px}
.pitem .pc{font-size:calc(11px * var(--fz));font-weight:800;text-align:right}
.pbar{grid-column:2/4;height:3.5px;border-radius:3px;background:var(--wgTrack);overflow:hidden;margin-top:2px}
.pbar i{display:block;height:100%;border-radius:3px;background:var(--wgBar)}
.ring{display:flex;align-items:center;gap:16px;margin-top:12px}
.ring svg{width:74px;height:74px;transform:rotate(-90deg)}
.ring .trk{stroke:var(--wgTrack)}
.ring .fgc{stroke:var(--ringFg)}
.ring .val{font-size:calc(25px * var(--fz));font-weight:800;letter-spacing:-0.48px}
.ring .lab{font-size:calc(10.5px * var(--fz));opacity:.7;margin-top:3px;line-height:1.5}
.nlist{margin-top:11px;display:flex;flex-direction:column;gap:9px}
.nrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:calc(11px * var(--fz))}
.nrow .tg{width:calc(46px * var(--fz));text-align:center;font-size:calc(8.5px * var(--fz));font-weight:800;
padding:2px 0;border-radius:5px;background:var(--chip);white-space:nowrap;overflow:hidden}
.nrow .tg.u{background:var(--chipU);color:var(--chipUFg)}
.nrow .t{opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .d{margin-left:auto;opacity:.55;font-size:calc(9.5px * var(--fz));flex-shrink:0}

/* 카테고리 존 — 격자 위에 깔리는 반투명 판. 아이콘은 그 위에 놓인다 */
.zone{position:relative;z-index:0;border-radius:28px;corner-shape:squircle;
background:var(--zoneBg);border:1px solid var(--zoneBorder);cursor:grab;min-width:0;min-height:0;
transition:background .3s,border-color .3s}
.zone:active{cursor:grabbing}
.zone .zl{position:absolute;left:16px;top:0;z-index:3;transform:translateY(-50%);display:flex;align-items:center;gap:6px;
cursor:grab;transition:transform .15s,box-shadow .15s;
font-size:calc(11px * var(--fz));font-weight:800;letter-spacing:-0.08px;color:var(--fg);padding:3px 10px;border-radius:99px;
background:var(--zoneTab);border:1px solid var(--zoneBorder);white-space:nowrap;
box-shadow:0 2px 8px rgba(14,22,30,.08)}
.zone .zl:hover{transform:translateY(-50%) scale(1.06);box-shadow:0 4px 12px rgba(14,22,30,.14)}
.zone .zl i{width:7px;height:7px;border-radius:50%;background:var(--zdot);display:block}
.zone .zl small{font-weight:700;opacity:.5;margin-left:1px}
.zone .rsz{position:absolute;right:7px;bottom:7px;width:22px;height:22px;border-radius:7px;
display:flex;align-items:center;justify-content:center;background:var(--rszBg);color:var(--fg);
opacity:0;transition:opacity .15s;cursor:nwse-resize;touch-action:none}
.zone:hover .rsz{opacity:.7}
.zone .rsz svg{width:11px;height:11px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.zone.rz{outline:2px solid var(--red);outline-offset:-2px}
.hgrid .ap,.hgrid .wg{position:relative;z-index:1}
.hgrid .ap{justify-self:center;align-self:start;margin-top:23px;padding:4px 6px;border-radius:16px}
.hgrid .slot.zone-slot{border-radius:28px;border-style:dashed}
.ghost .zone{width:100%;height:100%}

/* 앱 아이콘 — 격자 한 칸 */
.ap{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;cursor:pointer;
transition:transform .16s cubic-bezier(.3,1.4,.5,1);background:none;min-width:0}
.ap:hover{transform:scale(1.06)}
.ap:active{transform:scale(.94)}
.ap:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:14px}
.ap .ish{position:relative;width:60px;height:60px;
filter:drop-shadow(0 6px 12px rgba(14,22,30,.2)) drop-shadow(0 1.5px 3px rgba(14,22,30,.14))}
.ap .icon{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
font-weight:800;font-size:13.5px;letter-spacing:-0.2px;color:#fff;
background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,0) 54%),var(--g,#8A9099);
-webkit-mask:var(--sqmask);mask:var(--sqmask)}
.ap .icon small{font-size:8px;font-weight:700;opacity:.85;margin-top:2px}
.ap .ish .bd{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--red);
color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;
border:1.5px solid rgba(255,255,255,.45);z-index:2}
.ap .nm{font-size:calc(10.5px * var(--fz));font-weight:600;text-align:center;line-height:1.25;color:var(--fg);
text-shadow:var(--tshadow);max-width:104px}
.ap.soon .icon{opacity:.42}.ap.soon .nm{opacity:.5}

/* 재배치 (드래그) */
.slot{border-radius:26px;corner-shape:squircle;border:2px dashed var(--slotB);background:var(--slotBg)}
.hgrid .slot.icon-slot{border-radius:19px;width:66px;height:66px;justify-self:center;align-self:center}
.hgrid .slot.bad{border-color:rgba(232,26,59,.6);background:rgba(232,26,59,.08)}
.swaptarget{outline:2px dashed var(--slotB);outline-offset:3px;border-radius:26px}
.dock .slot{width:50px;height:50px;border-radius:16px;flex-shrink:0;
border-color:var(--dockSlotB);background:var(--dockSlotBg)}
.ghost{position:fixed;z-index:2000;pointer-events:none;transform:scale(1.14);transform-origin:center;
filter:drop-shadow(0 14px 26px rgba(0,0,0,.5))}
.ghost.ap{gap:0}
.ghost .ish{width:100%;height:100%}
.ghost.wgg{transform:scale(1.03)}
.ghost .wg{width:100%;height:100%;transform:none!important;animation:none!important}
.ghost .icon,.ghost .dk{transform:none!important;animation:none!important}
.ghost .tip{display:none}
body.editing{cursor:grabbing}
body.editing .ap,body.editing .dk{cursor:grabbing}
body.editing .ap:hover,body.editing .dk:hover{transform:none}
body.editing .dk .tip{opacity:0!important}
@keyframes jig{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
body.editing .ap .icon,body.editing .dk{animation:jig .34s ease-in-out infinite}
/* 상태 표시줄 액션 (배치 초기화 · 창 4분할) — 배경 없이, hover는 확대만 */
.sact{font-size:calc(10.5px * var(--fz));font-weight:600;color:var(--fg);background:none;border:none;padding:2px 3px;
display:none;align-items:center;gap:5px;opacity:.72;
transition:transform .17s cubic-bezier(.3,1.4,.5,1),opacity .15s}
.sact.show{display:inline-flex}
.sact:hover{transform:scale(1.09);opacity:1}
.sact:active{transform:scale(.97)}
.sact:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:6px}
.sact .ic{width:12px;height:12px}
@media (prefers-reduced-motion:reduce){body.editing .ap .icon,body.editing .dk{animation:none}}

/* 페이지 도트 */
.dots{position:fixed;bottom:98px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:15;pointer-events:none}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--dot);display:block}
.dots i.on{background:var(--dotOn)}

/* ══ Dock ══ */
/* Dock — 판 없이 아이콘만 배경 위에 떠 있는 형태 */
.dock{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:800;display:flex;align-items:center;gap:16px;
padding:6px 12px;background:none;border:none;box-shadow:none;
transition:transform .3s cubic-bezier(.2,.8,.3,1)}
/* 창을 최대화하면 Dock은 끝만 남기고 내려가고, 아래쪽에 커서를 대면 올라온다 */
body.dockhide .dock{transform:translateX(-50%) translateY(calc(100% + 16px))}
body.dockhide .dock:hover,body.dockhide .dockzone:hover ~ .dock,body.dockhide.dockpeek .dock{transform:translateX(-50%)}
body.dockhide .dots,body.dockhide .homebar{opacity:0;transition:opacity .25s}
.dockzone{position:fixed;left:0;right:0;bottom:0;height:16px;z-index:790;display:none}
body.compact .dockzone{height:28px}
body.dockhide .dockzone{display:block}
.dk{width:50px;height:50px;display:flex;align-items:center;justify-content:center;
color:#fff;font-size:11.5px;font-weight:800;letter-spacing:-0.12px;position:relative;cursor:pointer;background:none;
filter:drop-shadow(0 5px 10px rgba(14,22,30,.22)) drop-shadow(0 1.5px 3px rgba(14,22,30,.16));
transition:transform .17s cubic-bezier(.3,1.4,.5,1)}
.dk .dksurf{position:absolute;inset:0;
background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 54%),var(--g,#8A9099);
-webkit-mask:var(--sqmask);mask:var(--sqmask)}
.dk .dkl{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
line-height:1.1}
.dk:hover{transform:translateY(-8px) scale(1.1)}
.dk:active{transform:translateY(-2px) scale(.96)}
.dk .dkl small{font-size:7.5px;font-weight:700;opacity:.85;margin-top:1px;display:block}
.dk .run{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;
background:rgba(255,255,255,.92);opacity:0;transition:opacity .2s}
.dk.on .run{opacity:1}
.dk .tip{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:calc(10.5px * var(--fz));
font-weight:600;color:#1D1D1F;background:rgba(255,255,255,.95);padding:4px 10px;border-radius:7px;
box-shadow:0 4px 14px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .15s}
.dk:hover .tip{opacity:1}
.dsep{width:1px;height:34px;background:var(--fg);opacity:.16;border-radius:1px}
/* Dock 맨 앞 검색·홈에 추가 버튼 — 앱 아이콘처럼 불투명한 판으로 떠 있어야 뒤 내용이 비치지 않는다 */
.dk.dsearch{color:var(--dkBtnFg,#3A3A3C)}
.dk.dsearch .dksurf{background:var(--dkBtn,#E4E6EA);border:none;
-webkit-mask:var(--sqmask);mask:var(--sqmask)}
.dk.dsearch .ic{width:21px;height:21px;position:relative;z-index:1;stroke-width:2.1;opacity:.85}
.dk.dsearch:hover .ic{opacity:1}

/* 스포트라이트 검색 */
.spot{position:fixed;inset:0;z-index:1200;display:flex;align-items:flex-start;justify-content:center;
padding-top:14vh;background:rgba(16,22,30,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
opacity:0;pointer-events:none;transition:opacity .16s}
.spot.on{opacity:1;pointer-events:auto}
.spotbox{width:min(620px,92vw);border-radius:24px;corner-shape:squircle;overflow:hidden;
background:var(--menuBg);backdrop-filter:blur(34px) saturate(180%);-webkit-backdrop-filter:blur(34px) saturate(180%);
border:1px solid var(--menuBorder);box-shadow:var(--menuShadow);color:var(--fg);
transform:translateY(-10px) scale(.98);transition:transform .18s cubic-bezier(.2,.9,.3,1.1)}
.spot.on .spotbox{transform:none}
.spotin{display:flex;align-items:center;gap:12px;padding:16px 18px}
.spotin .ic{width:20px;height:20px;opacity:.5;stroke-width:2.1}
.spotin input{flex:1;border:none;background:none;outline:none;font:inherit;font-size:calc(19px * var(--fz));font-weight:600;
color:var(--fg);letter-spacing:-0.12px}
.spotin input::placeholder{color:var(--fg);opacity:.36;font-weight:500}
.spotin kbd{font:inherit;font-size:calc(10.5px * var(--fz));font-weight:700;opacity:.45;border:1px solid var(--menuLine);
border-radius:6px;padding:2px 7px}
.spotres{max-height:52vh;overflow-y:auto;border-top:1px solid var(--menuLine);padding:8px}
.spotres:empty{display:none}
.sres{display:flex;align-items:center;gap:12px;width:100%;padding:9px 11px;border-radius:12px;
text-align:left;color:var(--fg)}
.sres:hover,.sres.sel{background:var(--menuHov)}
.sres .si{width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
font-size:10.5px;font-weight:800;color:#fff;
background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,0) 54%),var(--g,#8A9099);
-webkit-mask:var(--sqmask);mask:var(--sqmask)}
.sres .st{font-size:calc(13.5px * var(--fz));font-weight:700;letter-spacing:-0.12px}
.sres .ss{font-size:calc(11px * var(--fz));opacity:.55;margin-top:1px}
.sres .sk{margin-left:auto;font-size:calc(9.5px * var(--fz));font-weight:800;letter-spacing:.6px;opacity:.45;text-transform:uppercase}
.spotempty{padding:26px 16px;text-align:center;font-size:calc(12.5px * var(--fz));opacity:.5}

/* 모든 App 서랍 */
.lib{padding-top:9vh}
.libbox{width:min(1080px,94vw);max-height:84vh;display:flex;flex-direction:column}
.libhd{display:flex;align-items:center;gap:16px;padding:20px 22px 14px;border-bottom:1px solid var(--menuLine)}
.libhd h2{font-size:calc(19px * var(--fz));font-weight:800;letter-spacing:-0.2px}
.libhd p{font-size:calc(12px * var(--fz));opacity:.55;margin-top:2px}
.libsearch{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--btnBg);
border:1px solid var(--btnBorder);border-radius:99px;padding:7px 12px;width:260px}
.libsearch .ic{width:15px;height:15px;opacity:.5}
.libsearch input{flex:1;border:none;background:none;outline:none;font:inherit;font-size:calc(13px * var(--fz));color:var(--fg);min-width:0}
.libsearch input::placeholder{color:var(--fg);opacity:.4}
.libhd kbd{font:inherit;font-size:calc(10.5px * var(--fz));font-weight:700;opacity:.45;border:1px solid var(--menuLine);border-radius:6px;padding:2px 7px}
.libbody{overflow-y:auto;padding:8px 22px 22px}
.lsec{margin-top:16px}
.lsec h3{display:flex;align-items:center;gap:7px;font-size:calc(12.5px * var(--fz));font-weight:800;letter-spacing:1px;opacity:.55;
text-transform:uppercase;margin-bottom:10px}
.lsec h3 i{width:7px;height:7px;border-radius:50%;display:block}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.lcard{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;border-radius:14px;
border:1px solid transparent;transition:background .15s,border-color .15s}
.lcard:hover{background:var(--menuHov);border-color:var(--menuLine)}
.lcard.soon .lic{opacity:.45}
.lcard .lic{width:40px;height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
font-size:11px;font-weight:800;color:#fff;
background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,0) 54%),var(--g,#8A9099);
-webkit-mask:var(--sqmask);mask:var(--sqmask);transition:transform .15s}
.lcard .lic:hover{transform:scale(1.08)}
.lcard .ln{min-width:0;flex:1}
.lcard .ln b{display:block;font-size:calc(12.5px * var(--fz));font-weight:700;letter-spacing:-0.12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard .ln small{display:block;font-size:calc(10.5px * var(--fz));opacity:.55;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard .ln .soonpill{display:inline-block;font-size:calc(9px * var(--fz));font-weight:800;padding:1px 6px;border-radius:99px;
background:var(--chip);opacity:.8;margin-left:4px;vertical-align:1px}
.ltg{flex-shrink:0;font-size:calc(10.5px * var(--fz));font-weight:700;padding:5px 10px;border-radius:99px;
border:1px solid var(--btnBorder);background:var(--btnBg);color:var(--fg);opacity:.85;transition:all .15s}
.ltg:hover{opacity:1}
.ltg.on{background:var(--red);border-color:transparent;color:#fff;opacity:1}
.lcard.soon .ltg{visibility:hidden}
.libtabs{display:flex;gap:2px;background:var(--btnBg);border-radius:99px;padding:3px;margin-left:8px;flex-shrink:0}
.libtabs button{font-size:calc(12px * var(--fz));font-weight:700;padding:5px 13px;border-radius:99px;color:var(--fg);opacity:.6;white-space:nowrap}
.libtabs button.on{background:var(--menuBg);opacity:1;box-shadow:0 1px 4px rgba(14,22,30,.12)}
.wcard .lic{font-size:14px}
.lsize{font-size:calc(9.5px * var(--fz));font-weight:800;opacity:.5;margin-left:5px}
/* 그룹 편집 행 */
.zrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;border:1px solid transparent}
.zrow:hover{background:var(--menuHov);border-color:var(--menuLine)}
.zrow .zdot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.zrow input.zname{flex:1;min-width:0;border:none;background:none;outline:none;font:inherit;font-size:calc(13px * var(--fz));font-weight:700;
color:var(--fg);padding:5px 8px;border-radius:8px;letter-spacing:-0.12px}
.zrow input.zname:focus{background:var(--btnBg)}
.zrow .zcount{font-size:calc(10.5px * var(--fz));opacity:.5;white-space:nowrap}
.zcolors{display:flex;gap:5px}
.zcolors button{width:16px;height:16px;border-radius:50%;border:2px solid transparent;padding:0}
.zcolors button.on{border-color:var(--fg)}
.zdel{font-size:calc(10.5px * var(--fz));font-weight:700;color:var(--red);opacity:.75;padding:4px 8px;border-radius:8px}
.zdel:hover{opacity:1;background:rgba(232,26,59,.1)}
.nz{margin-top:14px;padding:12px 12px 12px 14px;border:1px dashed var(--menuLine);border-radius:14px;
display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nz .nzl{font-size:calc(11px * var(--fz));font-weight:800;opacity:.55;letter-spacing:.6px;text-transform:uppercase;width:100%}
.nz input{flex:1;min-width:140px;font:inherit;font-size:calc(13px * var(--fz));font-weight:700;color:var(--fg);background:var(--btnBg);
border:1px solid var(--btnBorder);border-radius:10px;padding:7px 11px;outline:none}
.nz select{font:inherit;font-size:calc(12px * var(--fz));font-weight:600;color:var(--fg);background:var(--btnBg);border:1px solid var(--btnBorder);
border-radius:10px;padding:7px 9px;outline:none}
.nz .go{font-size:calc(12px * var(--fz));font-weight:700;background:var(--red);color:#fff;padding:8px 14px;border-radius:10px}
/* 컨텍스트 메뉴 (우클릭) */
.cmenu{position:fixed;z-index:1300;min-width:230px;padding:5px;border-radius:14px;corner-shape:squircle;
background:var(--menuBg);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
border:1px solid var(--menuBorder);box-shadow:var(--menuShadow);color:var(--fg);display:none}
.cmenu.on{display:block}
.cmenu .ct{padding:6px 10px 4px;font-size:calc(10px * var(--fz));font-weight:800;letter-spacing:.8px;opacity:.5;text-transform:uppercase}
.cmenu button{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:9px;font-size:calc(12.5px * var(--fz));
font-weight:600;color:var(--fg);text-align:left}
.cmenu button:hover{background:var(--menuHov)}
.cmenu button.danger{color:var(--red)}
.cmenu .sep{height:1px;background:var(--menuLine);margin:4px 2px}
.homebar{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);width:132px;height:4.5px;border-radius:3px;
background:var(--homebar);z-index:850;pointer-events:none}

/* ══ 창 시스템 ══ */
.snap{position:fixed;z-index:400;border-radius:16px;corner-shape:squircle;border:2px solid rgba(255,255,255,.6);
background:rgba(255,255,255,.16);backdrop-filter:blur(6px);pointer-events:none;opacity:0;
transition:opacity .14s,left .12s,top .12s,width .12s,height .12s}
.snap.show{opacity:1}

.win{position:fixed;border-radius:20px;corner-shape:squircle;overflow:hidden;background:transparent;color:var(--txt);display:flex;flex-direction:column;
box-shadow:0 26px 70px rgba(0,0,0,.42),0 0 0 .5px rgba(0,0,0,.3);
animation:winIn .26s cubic-bezier(.2,.9,.3,1.1)}
@keyframes winIn{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
.win.zooming{animation:none!important}
.win.closing{animation:winOut .18s ease forwards}
@keyframes winOut{to{opacity:0;transform:scale(.92)}}
.win.min{animation:winMin .22s ease forwards}
@keyframes winMin{to{opacity:0;transform:scale(.35) translateY(200px)}}
.win.snapping{transition:left .18s cubic-bezier(.2,.8,.3,1),top .18s,width .18s,height .18s}
.win.active{box-shadow:0 34px 84px rgba(0,0,0,.5),0 0 0 .5px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.1)}
/* 최대화: 상태 표시줄 아래 전체를 채운다 (모서리 없이) */
.win.max{border-radius:0;box-shadow:none}
.win.max .rs{display:none}
/* 좌우·4분할로 화면을 나눠 쓸 때도 모서리 없이 맞물리게 */
.win.flush{border-radius:0}

.wtb{height:46px;flex-shrink:0;display:flex;align-items:stretch;cursor:grab;
background:rgba(246,247,249,.72);backdrop-filter:blur(24px) saturate(180%);
-webkit-backdrop-filter:blur(24px) saturate(180%);
border-bottom:.5px solid var(--line);user-select:none}
.win.active .wtb{background:rgba(238,240,244,.84)}
.wtb:active{cursor:grabbing}
.wtb .tt{display:flex;align-items:center;gap:8px;padding-left:13px;margin-right:auto;pointer-events:none;
min-width:0;overflow:hidden;white-space:nowrap}
.wtb .tt .mk{width:18px;height:18px;-webkit-mask:var(--sqmask);mask:var(--sqmask);display:flex;align-items:center;justify-content:center;
font-size:6.5px;font-weight:900;color:#fff;flex-shrink:0}
.wtb .tt .n{font-size:calc(12.5px * var(--fz));font-weight:700;color:var(--ink);letter-spacing:-0.12px;
overflow:hidden;text-overflow:ellipsis}
.wtb .tt .s{font-size:calc(10.5px * var(--fz));color:var(--txt3);font-weight:600;flex-shrink:0}
/* 우측 창 컨트롤 (Windows 스타일) */
.wctl{display:flex;flex-shrink:0;align-self:stretch}
.wctl button{width:44px;display:flex;align-items:center;justify-content:center;color:var(--txt2);
border-left:.5px solid transparent;transition:background .12s,color .12s}
.wctl button:hover{background:rgba(0,0,0,.08);color:var(--ink)}
.wctl button:active{background:rgba(0,0,0,.14)}
.wctl button.close:hover{background:var(--red);color:#fff}
.wctl button.close:active{background:#C4142F;color:#fff}
.wctl button:focus-visible{outline:2px solid var(--blue);outline-offset:-3px}
.wctl svg{width:11px;height:11px;stroke:currentColor;stroke-width:1.35;fill:none;stroke-linecap:square}
.wbody{flex:1;overflow:auto;background:#fff;min-height:0}
/* ── 실제 앱(iframe) 창 + 로딩 스피너 ── */
.wbody.frame{overflow:hidden;position:relative;display:flex}
.appframe{flex:1;width:100%;height:100%;border:0;display:block;background:#fff}
.app-loading{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--txt2);font-size:calc(11px * var(--fz));font-weight:500;z-index:2}
.app-loading .spinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.winDrag iframe{pointer-events:none}
/* ── 다운로드 배지 (아이콘 우측 하단) ── */
.dlb{position:absolute;right:-7px;bottom:-7px;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--red);
display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;
box-shadow:0 2px 6px rgba(14,22,30,.28),0 0 0 1.5px rgba(255,255,255,.9);transition:transform .15s cubic-bezier(.3,1.4,.5,1),background .15s,color .15s}
.dlb .ic{width:13px;height:13px;stroke-width:2.6}
.dlb:hover,.dlb:focus-visible{transform:scale(1.18);background:var(--red);color:#fff;outline:none}
.dk .dlb{right:-5px;bottom:-5px;width:20px;height:20px}
.dk .dlb .ic{width:11px;height:11px}
.ap.soon .dlb{opacity:1}
body.editing .dlb{display:none}
body:not(.user-ready) .greet h1,body:not(.user-ready) #profBtn{visibility:hidden}   /* 사용자 이름 채우기 전 */
.pmenu .mi.adm{display:none}body.is-admin .pmenu .mi.adm{display:flex}   /* 관리자에게만 */
/* ── SSO 앱: 팝업 로그인 안내 (iframe 안에서는 Microsoft 로그인 화면이 열리지 않으므로) ── */
.auth-gate{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:3;padding:40px;text-align:center}
.auth-gate .ag-ico{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:#F3F4F6;color:var(--ink)}
.auth-gate .ag-ico .ic{width:28px;height:28px;stroke-width:1.8}
.auth-gate .ag-t{font-size:calc(14px * var(--fz));font-weight:700;color:var(--ink)}
.auth-gate .ag-d{font-size:calc(11px * var(--fz));color:var(--txt2);line-height:1.7;max-width:420px}
.auth-gate .ag-btn{margin-top:6px;padding:12px 22px;border-radius:12px;background:var(--red);color:#fff;font-size:calc(12px * var(--fz));font-weight:700;box-shadow:0 8px 20px rgba(232,26,59,.28)}
.auth-gate .ag-btn:hover{transform:translateY(-1px)}
.auth-gate .ag-skip{font-size:calc(10.5px * var(--fz));color:var(--txt3);text-decoration:underline;cursor:pointer}
.wctl .relogin{margin-right:6px;opacity:.75}
.wctl .relogin:hover{opacity:1;color:var(--red)}
.wbody::-webkit-scrollbar{width:9px;height:9px}
.wbody::-webkit-scrollbar-thumb{background:rgba(0,0,0,.2);border-radius:9px;border:2.5px solid #fff}
.rs{position:absolute;z-index:5}
.rs.n{top:0;left:8px;right:8px;height:6px;cursor:ns-resize}
.rs.s{bottom:0;left:8px;right:8px;height:6px;cursor:ns-resize}
.rs.w{left:0;top:8px;bottom:8px;width:6px;cursor:ew-resize}
.rs.e{right:0;top:8px;bottom:8px;width:6px;cursor:ew-resize}
.rs.nw{left:0;top:0;width:14px;height:14px;cursor:nwse-resize}
.rs.ne{right:0;top:0;width:14px;height:14px;cursor:nesw-resize}
.rs.sw{left:0;bottom:0;width:14px;height:14px;cursor:nesw-resize}
.rs.se{right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize}

/* ══ 창 내부 공용 UI ══ */
.pad{padding:20px 22px 26px}
.h1{font-size:calc(21px * var(--fz));font-weight:800;color:var(--ink);letter-spacing:-0.32px}
.h1 span{color:var(--red)}
.hsub{font-size:calc(11.5px * var(--fz));color:var(--txt2);margin:5px 0 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:18px}
.kpi{border:.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.kpi .l{font-size:calc(10px * var(--fz));color:var(--txt2);font-weight:600;display:flex;align-items:center;gap:5px}
.kpi .l i{width:6px;height:6px;border-radius:50%}
.kpi .v{font-size:calc(22px * var(--fz));font-weight:800;color:var(--ink);letter-spacing:-0.4px;margin-top:6px;line-height:1}
.kpi .v small{font-size:calc(10.5px * var(--fz));color:var(--txt3);font-weight:600;margin-left:2px;letter-spacing:0}
.kpi.w .v{color:var(--red)}
.sh{display:flex;align-items:center;margin-bottom:9px}
.sh h3{font-size:calc(14.5px * var(--fz));font-weight:700;color:var(--ink);letter-spacing:-0.12px}
.sh a{margin-left:auto;font-size:calc(10.5px * var(--fz));color:var(--blue);font-weight:600;text-decoration:none}
.rows{border:.5px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.rows .r{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 13px;
border-bottom:.5px solid var(--line2)}
.rows .r:last-child{border-bottom:none}
.rows .r:hover{background:#FAFAFC}
.r .av{width:28px;height:28px;border-radius:9px;color:#fff;font-size:10.5px;font-weight:800;
display:flex;align-items:center;justify-content:center}
.r .t{font-size:calc(12px * var(--fz));font-weight:700;color:var(--ink);letter-spacing:-0.08px}
.r .m{font-size:calc(10px * var(--fz));color:var(--txt3);margin-top:2px}
.r .rt{text-align:right;min-width:86px}
.r .pc{font-size:calc(11.5px * var(--fz));font-weight:800;color:var(--ink)}
.bar{height:4px;border-radius:3px;background:var(--line2);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--red)}
.tagp{font-size:calc(10px * var(--fz));font-weight:700;padding:2.5px 8px;border-radius:99px;white-space:nowrap}
.tagp.f{background:#FDECEF;color:var(--red)}.tagp.r{background:#EAF3FB;color:var(--blue)}
.tagp.o{background:#E9F6EF;color:var(--ok)}.tagp.a{background:#FDF3E6;color:var(--amber)}
.apptabs{display:flex;gap:6px;margin:14px 0 4px}
.apptabs span{font-size:calc(12px * var(--fz));font-weight:700;padding:7px 15px;border-radius:9px;color:var(--txt2);
  background:var(--wgTrack);cursor:pointer}
.apptabs span.on{background:var(--ink);color:#fff}
.wg .ntabs-w{display:flex;gap:8px;margin:8px 0 13px}
.wg .ntabs-w span{font-size:calc(10.5px * var(--fz));font-weight:700;padding:6px 13px;border-radius:8px;
  color:var(--wgFg);opacity:.55;background:var(--wgTrack);cursor:pointer}
.wg .ntabs-w span.on{opacity:1;background:var(--wgFg);color:var(--wgBg)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:calc(9.5px * var(--fz));font-weight:800;letter-spacing:.8px;color:var(--txt3);padding:9px 14px;
border-bottom:.5px solid var(--line);text-transform:uppercase;background:#FAFAFB;position:sticky;top:0}
.tbl td{padding:10px 14px;font-size:calc(11.5px * var(--fz));border-bottom:.5px solid var(--line2);color:var(--txt)}
.tbl td b{color:var(--ink);font-weight:700}
.tbl tr:hover td{background:#FAFAFC}
.dband{background:linear-gradient(120deg,#FFF2F4,#FDF8F9);border:.5px solid #F7D9DF;border-radius:12px;
padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.dband .dd{font-size:calc(19px * var(--fz));font-weight:800;color:var(--red);letter-spacing:-0.4px}
.dband .tt2{font-size:calc(12px * var(--fz));font-weight:700;color:var(--ink)}
.dband .mm{font-size:calc(10px * var(--fz));color:var(--txt2);margin-top:2px}
.dband button{margin-left:auto;background:var(--red);color:#fff;font-size:calc(10.5px * var(--fz));font-weight:600;padding:6px 11px;border-radius:8px}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
color:var(--txt3);padding:40px}
.empty .bigicon{width:64px;height:64px;-webkit-mask:var(--sqmask);mask:var(--sqmask);display:flex;align-items:center;justify-content:center;
font-size:15px;font-weight:800;color:#fff;opacity:.6}
.empty .t{font-size:calc(14px * var(--fz));font-weight:700;color:var(--txt2)}
.empty .d{font-size:calc(11.5px * var(--fz));text-align:center;line-height:1.6;max-width:280px}
/* 설정 창 */
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.thc{border:1.5px solid var(--line);border-radius:12px;padding:9px;text-align:left;background:#fff;
display:flex;flex-direction:column;gap:2px;transition:border-color .15s,box-shadow .15s}
.thc:hover{border-color:#C9CDD3}
.thc.on{border-color:var(--red);box-shadow:0 0 0 2.5px rgba(232,26,59,.16)}
.thc .pv{height:56px;border-radius:10px;corner-shape:squircle;margin-bottom:7px;border:.5px solid rgba(0,0,0,.08)}
.thc .tn2{font-size:calc(12.5px * var(--fz));font-weight:700;color:var(--ink)}
.thc .td{font-size:calc(10.5px * var(--fz));color:var(--txt3)}
.pv.gray,.sw.gray{background:#F2F3F5;border:.5px solid rgba(0,0,0,.08)}
.pv.light,.sw.light{background:radial-gradient(70% 90% at 20% 0%,rgba(232,26,59,.34),rgba(232,26,59,0) 62%),
radial-gradient(70% 90% at 95% 40%,rgba(0,98,184,.3),rgba(0,98,184,0) 62%),linear-gradient(150deg,#FFFFFF,#E3EAF1)}
.pv.soft,.sw.soft{background:radial-gradient(70% 90% at 20% 0%,rgba(232,26,59,.12),rgba(232,26,59,0) 62%),
linear-gradient(150deg,#FFFFFF,#E5EBF1)}
.pv.mist,.sw.mist{background:linear-gradient(150deg,#F8FAFC,#C4D2DF)}
.pv.dark,.sw.dark{background:linear-gradient(150deg,#3B4A5A,#141C25)}
.sbtn{font-size:calc(11.5px * var(--fz));font-weight:600;padding:6px 12px;border-radius:8px;border:.5px solid var(--line);
background:#fff;color:var(--txt)}
.sbtn:hover{background:#F5F5F7}
.swt{width:40px;height:24px;border-radius:99px;background:var(--ok);position:relative;display:block}
.swt::after{content:'';position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;
background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.swt.off{background:#E1E1E6}
.swt.off::after{right:auto;left:2px}

/* 스티커 메모 — 배경 위에 붙는 포스트잇. 창 뒤, 홈 위 */
.stickies{position:fixed;inset:var(--statusH) 0 0 0;z-index:50;display:none;pointer-events:none}
.stickies.on{display:block}
.stool{display:none}
.stky{position:absolute;width:264px;min-height:224px;display:flex;flex-direction:column;pointer-events:auto;
background:var(--sc,#FFF59D);color:#3A3100;border-radius:3px 3px 18px 3px;
box-shadow:0 12px 26px rgba(60,45,0,.18),0 2px 4px rgba(0,0,0,.08);transform:rotate(var(--rot,0deg));
transition:box-shadow .15s,transform .15s}
.stky.top{box-shadow:0 20px 44px rgba(60,45,0,.26),0 2px 6px rgba(0,0,0,.1)}
.stky::after{content:'';position:absolute;right:0;bottom:0;width:30px;height:30px;border-radius:0 0 18px 0;
background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.06) 50%,rgba(0,0,0,.15));pointer-events:none}
.sbar{height:32px;display:flex;align-items:center;gap:5px;padding:0 6px 0 6px;background:rgba(0,0,0,.07);cursor:grab;
border-radius:3px 3px 0 0;user-select:none;flex-shrink:0}
.sbar:active{cursor:grabbing}
.sbar .sb{width:26px;height:26px;border-radius:8px;font-size:18px;font-weight:800;color:rgba(0,0,0,.5);
display:flex;align-items:center;justify-content:center;line-height:1}
.sbar .sb:hover{background:rgba(0,0,0,.1);color:#000}
.sbar .scol{display:flex;gap:5px;margin-left:auto;margin-right:2px}
.sbar .scol button{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(0,0,0,.15);padding:0}
.sbar .scol button.on{border-color:rgba(0,0,0,.65)}
.stxt{flex:1;border:none;outline:none;resize:none;background:none;padding:12px 15px 6px;font:inherit;
font-size:calc(12.5px * var(--fz));line-height:1.6;color:inherit;min-height:120px}
.stxt::placeholder{color:rgba(0,0,0,.35)}
.sft{display:flex;align-items:center;padding:2px 14px 9px;font-size:calc(9.5px * var(--fz));color:rgba(0,0,0,.45)}
.sft button{margin-left:auto;font-size:calc(9.5px * var(--fz));font-weight:700;color:rgba(0,0,0,.5);padding:3px 8px;border-radius:6px}
.sft button:hover{background:rgba(0,0,0,.08);color:#B3261E}
body[data-theme="dark"] .stky{box-shadow:0 12px 26px rgba(0,0,0,.4)}
/* 좁은 화면: 반투명 판 위에 세로로 쌓인 메모 목록 */
body.compact .stickies.on{pointer-events:auto;background:rgba(20,24,30,.3);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
overflow-y:auto;padding:12px 12px 110px}
body.compact .stool{display:flex;align-items:center;gap:8px;padding:4px 4px 12px;color:#fff;font-size:calc(12px * var(--fz));font-weight:800}
body.compact .stool .tn{opacity:.7;font-weight:700}
body.compact .stool button{font-size:calc(10.5px * var(--fz));font-weight:700;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.18);color:#fff}
body.compact .stool button:first-of-type{margin-left:auto;background:#fff;color:#1C1C1E}
body.compact .stky{position:static;width:auto;margin:0 0 12px;transform:none;min-height:0}
body.compact .stxt{min-height:80px}
body.compact .sbar{cursor:default}
/* 메모 관리 창 */
.memo{display:flex;height:100%;min-height:0}
.mlist{width:calc(230px * var(--fz));flex-shrink:0;border-right:.5px solid var(--line);display:flex;flex-direction:column;background:#FAFAFB;min-height:0}
.mhd{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 16px;border-bottom:.5px solid var(--line)}
.mhd b{font-size:calc(13px * var(--fz));color:var(--ink);font-weight:800}
.mhd .mcnt{font-size:calc(10.5px * var(--fz));color:var(--txt3);font-weight:700}
.mnew{margin-left:auto;font-size:calc(10.5px * var(--fz));font-weight:700;color:#fff;background:var(--red);padding:6px 11px;border-radius:99px}
.mitems{overflow-y:auto;flex:1;padding:6px;min-height:0}
.mfoot{display:flex;flex-wrap:wrap;gap:6px;padding:9px 10px;border-top:.5px solid var(--line)}
.msub{font-size:calc(10px * var(--fz));font-weight:700;color:var(--txt2);background:#fff;border:.5px solid var(--line);
padding:5px 9px;border-radius:8px}
.msub:hover{background:#F3F4F6;color:var(--ink)}
.msub.warn:hover{color:var(--red);border-color:#F7D9DF}
.msub.on{background:var(--red);color:#fff;border-color:transparent}
.mi2{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;padding:9px 11px;border-radius:12px;color:var(--txt)}
.mi2:hover{background:#F1F2F5}
.mi2.on{background:#fff;box-shadow:inset 3px 0 0 var(--red),0 1px 4px rgba(0,0,0,.06)}
.mi2 .mdot{width:11px;height:11px;border-radius:3px;flex-shrink:0;margin-top:3px;border:.5px solid rgba(0,0,0,.12)}
.mi2 .mtx{min-width:0;flex:1}
.mi2 .mt{display:block;font-size:calc(12px * var(--fz));font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi2 .ms{display:block;font-size:calc(10px * var(--fz));color:var(--txt3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi2 .ms .tn{color:var(--txt2);font-weight:700;margin-right:4px}
.mi2 .mpin{font-size:calc(9px * var(--fz));font-weight:800;color:var(--ok);flex-shrink:0;margin-top:3px}
.medit{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.mtool{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:.5px solid var(--line2);
font-size:calc(10.5px * var(--fz));color:var(--txt3);flex-wrap:wrap}
.mtool .zcolors{margin-left:auto}
.mtool .zcolors button{width:15px;height:15px;border:2px solid transparent}
.mtool .zcolors button.on{border-color:var(--ink)}
.mdel{font-size:calc(10.5px * var(--fz));font-weight:700;color:var(--red);padding:5px 10px;border-radius:8px}
.mdel:hover{background:#FDECEF}
.mdel[disabled],.msub[disabled]{opacity:.35;pointer-events:none}
.medit textarea{flex:1;border:none;outline:none;resize:none;padding:16px 18px 22px;font:inherit;font-size:calc(13px * var(--fz));
line-height:1.7;color:var(--ink);background:#fff;min-height:0}
.medit textarea::placeholder{color:var(--txt3)}
.mempty{padding:20px 14px;text-align:center;font-size:calc(11px * var(--fz));color:var(--txt3)}
body.compact .memo{flex-direction:column}
body.compact .mlist{width:auto;max-height:42%;border-right:none;border-bottom:.5px solid var(--line)}
/* 메모 위젯 */
.wg .mlines{margin-top:5px;display:flex;flex-direction:column;gap:0}
.wg .mlines .drow{padding:1px 0}
.wg .mlines .drow .dd{min-width:calc(40px * var(--fz));opacity:.6}
.wg .mempty{padding:12px 0;text-align:left;color:inherit;opacity:.6}
/* AI 칼 위젯 — 최근 대화 몇 줄과 바로 묻는 입력칸 */
.wg.kalw .wgc{display:flex;flex-direction:column}
.wg.kalw .hd .sq{background:#1C1F27 center/78% no-repeat}
.klines{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:6px;margin-top:10px;
padding-right:2px;cursor:default;scrollbar-width:thin}
.klines>:first-child{margin-top:auto}   /* 내용이 적으면 아래(입력칸)쪽에 붙고, 많으면 스크롤 */
body.compact .klines{max-height:calc(150px * var(--fz))}
.kb{max-width:88%;flex-shrink:0;font-size:calc(10.5px * var(--fz));line-height:1.5;padding:6px 10px;border-radius:13px;word-break:keep-all}
/* 답변은 자르지 않고 전부 보여 준다 — 길면 대화 영역 안에서 스크롤 */
.kb .kt{display:block}
.kb.ai{align-self:flex-start;background:rgba(20,30,45,.06);border-bottom-left-radius:4px}
.kb.me{align-self:flex-end;background:var(--red);color:#fff;border-bottom-right-radius:4px}
.kb b{font-weight:800}
.kchips{display:flex;gap:5px;flex-wrap:nowrap;margin-top:8px;overflow:hidden;flex-shrink:0;
-webkit-mask:linear-gradient(90deg,#000 82%,transparent);mask:linear-gradient(90deg,#000 82%,transparent)}
.kchips button{font-size:calc(9.5px * var(--fz));font-weight:700;padding:3px 9px;border-radius:99px;
border:1px solid rgba(20,30,45,.14);background:rgba(255,255,255,.7);color:inherit;white-space:nowrap}
.kchips button:hover{border-color:var(--red);color:var(--red)}
.kinw{margin-top:9px;margin-right:14px;flex-shrink:0;display:flex;align-items:center;gap:6px}   /* 오른쪽 여백: 크기 조정 손잡이 자리 */
.kinw .kin{flex:1;min-width:0;background:rgba(20,30,45,.06);border:none;border-radius:99px;padding:7px 12px;font:inherit;
font-size:calc(10.5px * var(--fz));color:inherit;outline:none;cursor:text}
.kinw .kin::placeholder{color:inherit;opacity:.5}
.kinw .kin:focus{background:rgba(20,30,45,.1);box-shadow:0 0 0 2px rgba(232,26,59,.22)}
.kinw .kgo{width:26px;height:26px;border-radius:50%;background:#1C1F27;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kinw .kgo .ic{width:12px;height:12px;stroke-width:2.6}
.wg.kalw[data-c="1"] .kchips,.wg.kalw[data-r="1"] .kchips{display:none}
.wg.kalw[data-r="1"] .klines{display:none}
body[data-theme="dark"] .kb.ai{background:rgba(255,255,255,.14)}
body[data-theme="dark"] .kinw .kin{background:rgba(255,255,255,.14)}
body[data-theme="dark"] .kchips button{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
/* 채팅 */
.chatwrap{display:flex;flex-direction:column;height:100%}
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#FAFAFB}
.msg{max-width:78%;font-size:calc(12px * var(--fz));line-height:1.65;padding:9px 13px;border-radius:16px}
.msg.me{align-self:flex-end;background:var(--red);color:#fff;border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:#fff;border:.5px solid var(--line);border-bottom-left-radius:5px}
.msg.ai b{color:var(--ink)}
.inp{flex-shrink:0;padding:11px 13px;border-top:.5px solid var(--line);display:flex;gap:9px;align-items:center;background:#fff}
.inp .f{flex:1;background:#F2F2F5;border-radius:99px;padding:9px 14px;font-size:calc(11.5px * var(--fz));color:var(--txt3)}
.inp .go{width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center}
/* AQI */
.aqihero{display:flex;align-items:center;gap:24px;padding:6px 0 20px}
.aqihero svg{width:112px;height:112px;transform:rotate(-90deg)}
.aqihero .val{font-size:calc(38px * var(--fz));font-weight:800;color:var(--ink);letter-spacing:-0.8px;line-height:1}
.aqihero .val small{font-size:calc(14px * var(--fz));color:var(--txt3);font-weight:700;letter-spacing:0}
.aqihero .d{font-size:calc(11.5px * var(--fz));color:var(--txt2);margin-top:7px;line-height:1.6}
.metric{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:.5px solid var(--line2)}
.metric:last-child{border-bottom:none}
.metric .n{font-size:calc(11.5px * var(--fz));font-weight:600;color:var(--ink);width:130px;flex-shrink:0}
.metric .tr{flex:1;height:6px;border-radius:4px;background:var(--line2);overflow:hidden}
.metric .tr i{display:block;height:100%;border-radius:4px}
.metric .v{font-size:calc(11.5px * var(--fz));font-weight:800;color:var(--ink);width:42px;text-align:right}
/* 캘린더 */
.cal{border:.5px solid var(--line);border-radius:12px;overflow:hidden}
.cal .hd{display:grid;grid-template-columns:repeat(7,1fr);background:#FAFAFB;border-bottom:.5px solid var(--line)}
.cal .hd div{padding:8px 0;text-align:center;font-size:calc(10px * var(--fz));font-weight:800;color:var(--txt3)}
.cal .bd{display:grid;grid-template-columns:repeat(7,1fr)}
.cal .d{min-height:56px;padding:6px 7px;border-right:.5px solid var(--line2);border-bottom:.5px solid var(--line2);font-size:calc(11px * var(--fz))}
.cal .d .n{font-weight:700;color:var(--ink);font-size:calc(11px * var(--fz))}
.cal .d.off .n{color:var(--txt3)}
.cal .d.today{background:#FDECEF}
.cal .d.today .n{color:var(--red);font-weight:800}
.cal .ev{margin-top:4px;font-size:calc(9px * var(--fz));font-weight:700;padding:2px 5px;border-radius:4px;line-height:1.4}
/* ══ 좁은 화면(모바일 · 태블릿 세로) — compact 모드 ══
   (폭 1024px 이하 또는 높이 600px 이하) 고정 10×5 격자 대신 세로로 흐르는 배치. 위젯은 축소하지 않고 원래 크기로, 그룹은 라벨 달린 블록으로,
   창은 전체 화면 시트로 연다. 배치 데이터는 그대로 두고 그리는 방식만 바꾼다. */
/* 넓지만 낮은 화면(노트북)에서는 인사말을 줄여 격자 칸 높이를 확보한다 */
@media (max-height:840px){
  body:not(.compact) .home{padding-top:0px;gap:22px}
  body:not(.compact) .greet h1{font-size:46px;letter-spacing:-0.5px;line-height:1.15}
  body:not(.compact) .greet p,body:not(.compact) .greet .datechip{font-size:13px;margin-top:3px}
  body:not(.compact) .hgrid{gap:12px}
}
body.compact{touch-action:auto;--dockH:82px}
body.compact .status{position:sticky;top:0;padding:0 12px 0 14px;white-space:nowrap;
background:var(--pageBg);z-index:900}
body.compact .dots,body.compact .dockzone,body.compact .homebar{display:none}
body.phone .status{font-size:calc(10.5px * var(--fz))}
body.phone .prof .nm{font-size:calc(9px * var(--fz))}
body.phone .prof .av{width:20px;height:20px}
body.compact #tile4{display:none}
/* 홈은 고정 상자 안에서 스크롤하지 않고 문서 자체가 스크롤된다 — 앱 웹뷰가 iframe 높이를 내용에 맞추는 경우에도 전부 보인다 */
html.compact,body.compact{height:auto;min-height:100%;overflow:visible}
body.compact{overflow-x:hidden}
body.compact .home{position:static;inset:auto;height:auto;min-height:calc(100vh - var(--statusH) - var(--dockH));
padding:4px 14px 10px;gap:8px;overflow:visible}
body.compact .home.pushed{transform:none;filter:none}
body.compact .greet{padding:4px 2px 2px}
body.compact .greet h1{font-size:26px;letter-spacing:-0.4px;line-height:1.22;word-break:keep-all}
body.compact .greet h1 em{letter-spacing:-0.44px}
body.compact .greet h1 em .role{font-size:.8em}
body.compact .greet p,body.compact .greet .datechip{font-size:12.5px;margin-top:4px;line-height:1.5}
body.phone .greet p{display:none}
body.compact .hgrid{flex:none;display:grid;grid-template-columns:repeat(var(--mc),1fr);grid-template-rows:none;
grid-auto-rows:auto;grid-auto-flow:row dense;gap:12px 10px;padding:8px 0 6px;align-items:stretch}
body.compact .hgrid .wg{grid-column:span var(--mcs,4);grid-row:auto;min-height:calc(var(--mrs,1) * 108px);
padding:14px 15px;cursor:default;border-radius:26px}
body.phone .hgrid .wg[data-r="1"] .big{font-size:calc(30px * var(--fz));margin-top:8px}
body.phone .hgrid .wg[data-r="1"] .ring{gap:10px}
body.phone .hgrid .wg[data-r="1"] .ring svg{width:54px;height:54px}
body.phone .hgrid .wg[data-r="1"] .ring .val{font-size:calc(22px * var(--fz))}
body.phone .hgrid .wg[data-r="1"] .ring .lab{font-size:calc(10px * var(--fz))}
body.compact .hgrid .wg:hover{transform:none}
body.compact .wgc{width:100%;height:auto;transform:none}   /* 내용에 맞춰 늘어난다 */
body.compact .wg .rsz,body.compact .wg .szl,body.compact .zone .rsz{display:none}
/* 그룹 블록: 라벨 + 안의 앱들 */
body.compact .mz{grid-column:1/-1;position:relative;z-index:0;border-radius:24px;corner-shape:squircle;
background:var(--zoneBg);border:1px solid var(--zoneBorder);padding:11px 8px 8px;transition:background .3s,border-color .3s}
body.compact .mz .zl{display:flex;align-items:center;gap:6px;font-size:calc(11px * var(--fz));font-weight:800;letter-spacing:-0.08px;
color:var(--fg);margin:0 0 6px 8px}
body.compact .mz .zl i{width:7px;height:7px;border-radius:50%;background:var(--zdot);display:block}
body.compact .mz .zl small{font-weight:700;opacity:.5;margin-left:1px}
/* 그룹 안의 앱: 개수만큼 열을 만들어 왼쪽부터 놓고, 열 간격을 양쪽 끝에 맞춰 벌린다 (하나면 왼쪽에) */
body.compact .mzapps{display:grid;grid-template-columns:repeat(var(--mzc,var(--mc)),auto);justify-content:space-between;
justify-items:center;gap:6px 8px;padding:0 6px}
body.compact .mzapps:empty::after{content:'앱 없음 — 홈에 추가에서 넣어 보세요';font-size:calc(11px * var(--fz));opacity:.5;grid-column:1/-1;padding:4px 8px 6px}
body.compact .hgrid .ap{padding:4px 2px;gap:5px;border-radius:14px;margin-top:0;align-self:start}
body.compact .ap:hover{transform:none}
body.compact .ap .ish{width:54px;height:54px}
body.compact .ap .icon{font-size:12.5px}
body.compact .ap .nm{font-size:calc(9.5px * var(--fz));max-width:86px}
body.phone .ap .nm{font-size:calc(8.5px * var(--fz));max-width:84px}
/* Dock: 탭 바처럼 항상 보이고, 항목이 많으면 가로로 넘긴다 */
/* Dock도 흐름 안에서 아래에 달라붙는다 — 스크롤되는 환경에서는 고정처럼, 아니면 문서 맨 아래에 */
/* --vvb: 앱 웹뷰의 하단 바가 뷰포트를 가리는 높이(JS가 visualViewport로 계산) — 그만큼 Dock을 더 올린다 */
/* 화면 폭 전체를 차지하고 위쪽이 바탕색으로 서서히 번지는 띠 — 스크롤 중 아래로 지나가는 아이콘·글자가 Dock과 겹쳐 보이지 않는다 */
body.compact .dock{position:sticky;left:0;bottom:0;
transform:none;margin:6px 0 0;width:100%;max-width:none;
gap:10px;padding:18px 8px calc(16px + env(safe-area-inset-bottom,0px) + var(--vvb,0px));
background:linear-gradient(to top,var(--pageBg) 0,var(--pageBg) calc(100% - 22px),transparent 100%);
overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
/* 가운데 정렬하되 항목이 넘치면 왼쪽부터 가로로 넘길 수 있게 */
body.compact .dock>:first-child{margin-left:auto}
body.compact .dock>:last-child{margin-right:auto}
body.compact.dockhide .dock{transform:none}
body.compact .dock::-webkit-scrollbar{display:none}
body.compact .dk{width:44px;height:44px;font-size:10.5px;flex-shrink:0}
body.phone .dock{gap:8px}
body.phone .dk{width:40px;height:40px;font-size:9.5px}
body.compact .dk .tip{display:none}
body.compact .dsep{height:28px}
body.compact .dots{bottom:calc(82px + env(safe-area-inset-bottom,0px) + var(--vvb,0px))}
body.compact .homebar{display:none}
body.compact .toast{bottom:calc(98px + env(safe-area-inset-bottom,0px) + var(--vvb,0px));max-width:calc(100vw - 32px);text-align:center}
/* 창: 전체 화면 시트 — 이동·크기 조정·최소화 없이 닫기만 */
body.compact .win{border-radius:0;animation:sheetIn .28s cubic-bezier(.2,.9,.3,1)}
@keyframes sheetIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
body.compact .win.active{box-shadow:none}
body.compact .rs{display:none}
body.compact .wctl [data-act="min"],body.compact .wctl [data-act="max"]{display:none}
body.compact .wtb{cursor:default}
body.compact .wtb .tt .s{display:none}
body.compact .pad{padding:14px 14px 22px}
body.compact .kpis{grid-template-columns:repeat(2,1fr)}
body.phone .thgrid{grid-template-columns:repeat(2,1fr)}
body.compact .cal .d{min-height:44px;padding:4px 5px}
body.compact .cal .ev{font-size:calc(8px * var(--fz));padding:1px 3px}
/* 검색 · 서랍 · 메뉴 */
body.compact .spot{padding-top:max(10px,env(safe-area-inset-top,0px))}
body.compact .spotbox{width:calc(100vw - 16px)}
body.compact .lib{padding-top:max(10px,env(safe-area-inset-top,0px))}
body.compact .libbox{max-height:calc(100vh - 20px)}
body.compact .libhd{flex-wrap:wrap;gap:8px 10px;padding:14px 14px 10px}
body.compact .libhd p{display:none}
body.compact .libtabs{margin-left:0}
body.compact .libsearch{margin-left:auto;width:auto;flex:1;min-width:110px}
body.compact .libhd kbd{display:none}
.libx{display:none;width:32px;height:32px;border-radius:50%;background:var(--btnBg);align-items:center;justify-content:center;flex-shrink:0}
body.compact .libx{display:flex}
body.compact .libhd>div:first-child{width:auto;flex:1}
body.compact .libbody{padding:4px 12px 14px}
body.compact .lgrid{grid-template-columns:1fr}
body.phone .lgrid{grid-template-columns:1fr}
body.compact .zrow{flex-wrap:wrap;row-gap:6px;padding:9px 8px}
body.compact .zrow input.zname{flex:1 1 110px}
body.compact .nz{padding:10px 10px 10px 12px}
body.compact .nz input{min-width:0;flex:1 1 100%}
body.compact .pmenu{right:8px;top:42px;width:min(340px,calc(100vw - 16px))}
body.compact .cmenu{min-width:200px}
body.compact .cmenu button{padding:10px 12px;font-size:calc(13.5px * var(--fz))}

/* ══ AI 칼 — 우측 하단에 떠 있는 챗봇 버튼과 위로 펼쳐지는 대화창 ══ */
.kalfab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px) + var(--vvb,0px));z-index:860;
width:88px;height:88px;padding:0;background:none;cursor:pointer;
filter:drop-shadow(0 10px 22px rgba(14,22,30,.30)) drop-shadow(0 2px 5px rgba(14,22,30,.18));
transition:transform .18s cubic-bezier(.3,1.4,.5,1)}
.kalfab:hover{transform:translateY(-3px) scale(1.06)}
.kalfab:active{transform:scale(.95)}
.kalfab:focus-visible{outline:2px solid var(--red);outline-offset:4px;border-radius:30%}
.kalfab .kf{position:absolute;inset:0;background:transparent center/contain no-repeat;
transition:transform .22s,opacity .22s}
.kalfab .kx{position:absolute;inset:12px;border-radius:50%;background:#1C1F27;color:#fff;display:flex;align-items:center;justify-content:center;
opacity:0;transform:rotate(-90deg) scale(.6);transition:transform .22s,opacity .22s}
.kalfab .kx .ic{width:22px;height:22px;stroke-width:2.4}
.kalfab.on .kf{opacity:0;transform:rotate(90deg) scale(.6)}
.kalfab.on .kx{opacity:1;transform:none}
.kalfab .kdot{position:absolute;top:16px;right:2px;width:15px;height:15px;border-radius:50%;background:#34C759;
border:2.5px solid var(--pageBg);transition:opacity .2s}
.kalfab.on .kdot{opacity:0}
.kalfab .ktip{position:absolute;right:calc(100% + 12px);top:50%;transform:translateY(-50%) translateX(6px);white-space:nowrap;
font-size:calc(10.5px * var(--fz));font-weight:700;color:#1D1D1F;background:rgba(255,255,255,.96);padding:6px 11px;border-radius:9px;
box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.kalfab:hover .ktip{opacity:1;transform:translateY(-50%)}
.kalfab.on .ktip{display:none}

.kal{position:fixed;right:22px;bottom:calc(122px + env(safe-area-inset-bottom,0px) + var(--vvb,0px));z-index:860;
width:min(400px,calc(100vw - 32px));height:min(600px,calc(100vh - var(--statusH) - 150px));
border-radius:22px;corner-shape:squircle;overflow:hidden;background:#fff;color:var(--txt);
box-shadow:0 26px 70px rgba(0,0,0,.34),0 0 0 .5px rgba(0,0,0,.18);display:flex;flex-direction:column;
transform-origin:calc(100% - 30px) calc(100% + 40px);transform:translateY(14px) scale(.55);opacity:0;pointer-events:none;
transition:transform .34s cubic-bezier(.22,.9,.25,1),opacity .2s ease-out}
.kal.show{transform:none;opacity:1;pointer-events:auto}
.kal .kh{height:60px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;background:#1C1F27;color:#fff}
.kal .kh .kav{width:36px;height:36px;border-radius:23%;background:#2A2F3B center/100% 100% no-repeat;flex-shrink:0}
.kal .kh .kt{margin-right:auto;min-width:0}
.kal .kh .kn{font-size:calc(12.5px * var(--fz));font-weight:800;line-height:1.15;letter-spacing:-0.1px}
.kal .kh .ks{font-size:calc(9.5px * var(--fz));opacity:.72;display:flex;align-items:center;gap:5px;margin-top:2px}
.kal .kh .ks i{width:7px;height:7px;border-radius:50%;background:#34C759;display:inline-block}
.kal .kh button{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;opacity:.8;flex-shrink:0}
.kal .kh button:hover{background:rgba(255,255,255,.14);opacity:1}
.kal .kh button .ic{width:17px;height:17px}
.kal .chatwrap{flex:1;min-height:0}
.kal .chips{display:flex;gap:6px;flex-wrap:wrap;padding:2px 14px 10px;background:#FAFAFB;flex-shrink:0}
.kal .chips button{font-size:calc(10.5px * var(--fz));font-weight:600;padding:5px 11px;border-radius:99px;
border:1px solid var(--line);background:#fff;color:var(--txt);transition:border-color .15s,color .15s}
.kal .chips button:hover{border-color:var(--red);color:var(--red)}
.kal .inp input{flex:1;min-width:0;background:#F2F2F5;border:none;border-radius:99px;padding:9px 14px;font:inherit;
font-size:calc(11.5px * var(--fz));color:var(--ink);outline:none;transition:background .15s,box-shadow .15s}
.kal .inp input::placeholder{color:var(--txt3)}
.kal .inp input:focus{background:#ECECF1;box-shadow:0 0 0 2px rgba(232,26,59,.22)}
.kal .inp .go{cursor:pointer;flex-shrink:0;transition:transform .15s,opacity .15s}
.kal .inp .go:hover{transform:scale(1.08)}
.kal .inp .go.off{opacity:.35;pointer-events:none}
.msg.typing{display:flex;gap:4px;align-items:center;padding:12px 14px}
.msg.typing i{width:6px;height:6px;border-radius:50%;background:var(--txt3);animation:kdots 1s infinite}
.msg.typing i:nth-child(2){animation-delay:.16s}.msg.typing i:nth-child(3){animation-delay:.32s}
@keyframes kdots{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
/* 좁은 화면: Dock 위쪽에 버튼을 두고, 대화창은 좌우를 채운다 */
body.compact .kalfab{right:10px;bottom:calc(var(--dockH) + 6px + env(safe-area-inset-bottom,0px) + var(--vvb,0px));width:76px;height:76px}
body.compact .kalfab .kdot{top:14px}
/* 숨기기: 버튼을 우클릭(터치는 길게 누르기)하면 메뉴에 숨기기, 대화창 머리에도 숨기기 버튼. 숨기면 오른쪽 가장자리에 로봇이 빼꼼 남는다 */
body.kalhide .kalfab,body.kalhide .kal{display:none}
/* 숨긴 버튼: 로봇이 제자리 높이에서 오른쪽 화면 밖으로 8/10쯤 밀려나 2/10만 보인다. 누르면 제자리로 돌아온다 */
.kalpeek{position:fixed;--pw:88px;right:calc(var(--pw) * -.8);bottom:calc(22px + env(safe-area-inset-bottom,0px) + var(--vvb,0px));z-index:860;
width:var(--pw);height:var(--pw);padding:0;background:none;cursor:pointer;display:none;
filter:drop-shadow(0 10px 22px rgba(14,22,30,.30)) drop-shadow(0 2px 5px rgba(14,22,30,.18));
transition:right .2s cubic-bezier(.3,1.2,.5,1)}
.kalpeek .kp{position:absolute;inset:0;background:center/contain no-repeat}
.kalpeek:hover{right:calc(var(--pw) * -.6)}
.kalpeek:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:30%}
body.kalhide .kalpeek{display:block}
body.compact .kalpeek{--pw:76px;right:calc(var(--pw) * -.8);bottom:calc(var(--dockH) + 6px + env(safe-area-inset-bottom,0px) + var(--vvb,0px))}
/* 되돌아올 때 오른쪽에서 미끄러져 들어온다 */
@keyframes kalArrive{from{transform:translateX(70%);opacity:.6}to{transform:none;opacity:1}}
.kalfab.arrive{animation:kalArrive .32s cubic-bezier(.22,.9,.25,1)}
body.compact .kalfab .ktip{display:none}
body.compact .kal{right:10px;bottom:calc(var(--dockH) + 94px + env(safe-area-inset-bottom,0px) + var(--vvb,0px));
width:min(420px,calc(100vw - 20px));height:min(560px,calc(100vh - var(--statusH) - var(--dockH) - 116px));transform-origin:calc(100% - 27px) calc(100% + 40px)}
body.phone .kal{left:10px;width:auto}

/* ══ A-2안 다듬기 — 굵기·곡률·그림자·여백을 한 체계로 (뒤에서 덮어쓴다) ══ */
body{--r-wg:24px;--r-zone:22px;--r-win:18px}
/* 글자: 700/800 남발을 줄여 제목 700 · 항목 600 · 본문 500 */
.greet h1{font-weight:600;opacity:.8}
.greet p{font-weight:500}
.status{font-weight:600}
.status .brand span{font-weight:600;letter-spacing:.1px}
.prof .nm{font-weight:600}
.ap .nm{font-weight:500}
/* 위젯: 곡률 32→24, 얇은 테두리, 낮고 부드러운 그림자 */
.wg{border-radius:var(--r-wg);
box-shadow:0 1px 2px rgba(20,30,45,.04),0 10px 28px rgba(20,30,45,.06)}
body:not([data-theme="dark"]) .wg{border-color:rgba(20,30,45,.06)}
.wg:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(20,30,45,.05),0 14px 34px rgba(20,30,45,.09)}
.wg .hd{font-weight:700;letter-spacing:-0.25px;opacity:.92;gap:8px}
.wg .hd .sq{width:22px;height:22px;border-radius:7px;font-size:8px;font-weight:800}
.wg .hd .cnt{font-weight:500;opacity:.55}
.wg.deadline{background:linear-gradient(160deg,#2F3B47,#1A2430)}
.big{font-weight:800}
.ring .val{font-weight:700}
.drow .dd{font-weight:700}
.plist{gap:11px}
.pitem{grid-template-columns:24px 1fr auto;gap:9px 10px}
.pitem .av{width:24px;height:24px;border-radius:7px;font-size:9.5px}
.pitem .t{font-weight:600}
.pitem .pc{font-weight:700;opacity:.85}
.pbar{height:3px}
.nrow .tg{font-weight:700;border-radius:6px}
body:not([data-theme="dark"]) .nrow .tg{background:rgba(20,30,45,.06)}
body:not([data-theme="dark"]) .nrow .tg.u{background:var(--chipU);color:var(--chipUFg)}
.nrow .t,.nrow .d{font-weight:500}
/* 그룹: 테두리 대신 아주 옅은 면, 라벨은 흰 알약에 가는 선 */
.zone{border-radius:var(--r-zone)}
body:not([data-theme="dark"]) .zone{background:rgba(20,30,45,.035);border-color:rgba(20,30,45,.045)}
.zone .zl{font-weight:700;padding:3px 10px 3px 9px;box-shadow:0 1px 3px rgba(14,22,30,.08)}
body:not([data-theme="dark"]) .zone .zl{background:#fff;border-color:rgba(20,30,45,.08)}
.zone .zl small{font-weight:600;opacity:.45}
/* 창: 곡률 20→18, 그림자 약간 낮춤, 제목 600 */
.win{border-radius:var(--r-win);box-shadow:0 24px 64px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.2)}
.wtb .tt .n{font-weight:600}
.wtb .tt .s{font-weight:500}
.h1{font-weight:700}
.kpi{border-radius:14px;border-color:var(--line2);box-shadow:0 1px 2px rgba(20,30,45,.03)}
.tbl th{font-weight:700}
.sh h3{font-weight:600}
/* 서랍·메뉴 */
.ltg{font-weight:600}
.lsec h3{font-weight:700}
.lcard{border-radius:12px}
.pmenu .mi{font-weight:600}
.cmenu button{font-weight:600}
/* Dock·플로팅 버튼 그림자 낮춤 */
.dk{filter:drop-shadow(0 4px 8px rgba(14,22,30,.16)) drop-shadow(0 1px 2px rgba(14,22,30,.12))}
.kalfab{filter:drop-shadow(0 8px 18px rgba(14,22,30,.24)) drop-shadow(0 2px 4px rgba(14,22,30,.14))}
/* 칼 대화창: 머리글 한 줄, 곡률 20, 포커스 링 연하게 */
.kal{border-radius:20px;box-shadow:0 22px 60px rgba(0,0,0,.26),0 0 0 .5px rgba(0,0,0,.14)}
.kal .kh{height:62px;gap:11px}
.kal .kh .kt{overflow:hidden}
.kal .kh .kn{font-weight:700}
.kal .kh .ks{font-size:calc(9px * var(--fz));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kal .kh button{width:30px;height:30px}
.kal .kh button .ic{width:15px;height:15px}
.kal .inp input:focus{box-shadow:0 0 0 3px rgba(232,26,59,.12)}
.msg{font-weight:500}
.msg.ai{border-color:var(--line2);box-shadow:0 1px 2px rgba(20,30,45,.04)}
.kal .chips button,.kchips button{font-weight:600}

/* ══ 내 일정 병합(직접입력·회의실예약·팀 스페이스) ══ */
.srcdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.wg .plusbtn{margin-left:auto;width:20px;height:20px;border-radius:6px;background:rgba(0,0,0,.06);
  color:inherit;display:grid;place-items:center;font-size:13px;font-weight:800;line-height:1}
.wg .plusbtn:hover{background:rgba(0,0,0,.12)}
.wg.deadline .plusbtn{background:rgba(255,255,255,.14);color:#fff}
.wg.deadline .plusbtn:hover{background:rgba(255,255,255,.22)}
.legend2{display:flex;gap:12px;margin-top:9px;padding-top:8px;border-top:1px solid var(--wgTrack);flex-wrap:wrap}
.legend2 span{display:flex;align-items:center;gap:5px;font-size:calc(10px * var(--fz));opacity:.7}
.legend2 i{width:7px;height:7px;border-radius:50%;flex:0 0 auto}

/* ══ 회의실 예약 ══ */
.roomhead{display:flex;align-items:center;gap:14px;margin:14px 0 4px;font-size:12px;color:var(--txt2)}
.roomlegend{display:flex;gap:14px;margin-left:auto}
.roomlegend span{display:flex;align-items:center;gap:6px;font-size:11.5px}
.roomlegend i{width:10px;height:10px;border-radius:4px;flex:0 0 auto}
.roomgrid{display:grid;grid-template-columns:84px repeat(10,1fr);gap:5px;margin-top:10px}
.roomgrid .rh{font-size:10.5px;font-weight:700;color:var(--txt2);text-align:center;padding:6px 0}
.roomgrid .rlabel{font-size:12.5px;font-weight:700;display:flex;align-items:center;color:var(--ink)}
.slotcell{height:40px;border-radius:8px;background:#F0F1F4;border:1px solid #E4E4E9;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:9.5px;color:var(--txt3);font-weight:700;
  transition:background .12s,transform .12s}
.slotcell:hover{background:#E4E7EC}
.slotcell.busy{background:#EDEFF2;color:#AEAEB2;cursor:default;border-style:dashed}
.slotcell.mine{background:linear-gradient(160deg,#5BC6C9,#1F8F92);color:#fff;border-color:transparent}
.slotcell.mine:hover{transform:scale(1.04)}
.roomnote{margin-top:14px;font-size:12px;color:var(--txt3);line-height:1.6}

/* ══ 팀 스페이스 ══ */
.tslist{padding:4px 0}
.tscard{display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:12px;cursor:pointer;border:1px solid var(--line2);margin-bottom:10px}
.tscard:hover{background:#FAFAFC}
.tscard .av{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:11.5px;font-weight:800;flex:0 0 auto}
.tscard .nm{font-size:14px;font-weight:700}
.tscard .mt{font-size:11.5px;color:var(--txt3);margin-top:2px}
.tscard .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.tsnew{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:12px;border:1.5px dashed #C9CFD6;color:var(--txt2);font-size:13px;font-weight:650;cursor:pointer;margin-top:6px}
.tsnew:hover{background:#FAFAFC;border-color:#AEB6C0}
.tsform{padding:6px 2px}
.tsform label{display:block;font-size:11.5px;font-weight:700;color:var(--txt2);margin:14px 0 6px}
.tsform label:first-child{margin-top:0}
.tsform input{width:100%;height:38px;border:1px solid #DCE0E5;border-radius:9px;padding:0 12px;font:inherit;font-size:13px}
.tsform .pk{display:flex;gap:8px;flex-wrap:wrap}
.tsform .pk span{width:30px;height:30px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;cursor:pointer;opacity:.4}
.tsform .pk span.on{opacity:1;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--red)}
.tsform .go{margin-top:20px;height:42px;width:100%;border-radius:10px;background:var(--red);color:#fff;font-weight:700;font-size:13.5px}
.tshd{display:flex;align-items:center;gap:14px;padding:16px 20px 0}
.tshd .av{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;flex:0 0 auto}
.tshd .nm{font-size:16px;font-weight:750;letter-spacing:-.02em}
.tshd .mt{font-size:11.5px;color:var(--txt3);margin-top:2px}
.tshd .mem{margin-left:auto;display:flex}
.tshd .mem span{width:27px;height:27px;border-radius:50%;border:2px solid #fff;margin-left:-8px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.tsback{background:none;border:0;color:var(--txt2);font-size:12px;font-weight:650;cursor:pointer;padding:16px 20px 0;display:block}
.tsback:hover{color:var(--ink)}
.tstabs{display:flex;gap:2px;padding:14px 20px 0;border-bottom:1px solid var(--line2);margin-top:10px}
.tstab{font-size:12.5px;font-weight:650;padding:10px 13px;color:var(--txt2);border-bottom:2px solid transparent;cursor:pointer}
.tstab.on{color:var(--red);border-bottom-color:var(--red)}
.tsbody{display:grid;grid-template-columns:1.5fr 1fr;gap:0;padding:18px 20px}
.tscol+.tscol{border-left:1px solid var(--line2);padding-left:20px;margin-left:2px}
.tsct{font-size:10.5px;font-weight:750;letter-spacing:.05em;color:var(--txt3);margin-bottom:10px}
.tspost{padding:11px 0;border-top:1px solid var(--line2)}
.tspost:first-child{border-top:0}
.tspost .pt{font-size:13px;font-weight:650;display:flex;align-items:center;gap:7px}
.tspost .pin{font-size:9.5px;font-weight:800;color:var(--red);background:#FDE9EC;padding:2px 6px;border-radius:4px}
.tspost .pm{font-size:11px;color:var(--txt3);margin-top:3px}
.tsfile{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--line2);font-size:12.5px}
.tsfile:first-child{border-top:0}
.tsfile .ex{width:24px;height:24px;border-radius:6px;flex:0 0 auto;display:grid;place-items:center;font-size:8px;font-weight:800;color:#fff}
.tsfile .fm{margin-left:auto;font-size:10.5px;color:var(--txt3)}
.tsev{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line2);font-size:12.5px}
.tsev:first-child{border-top:0}
.tsev .d{font-size:11px;font-weight:700;color:var(--red);flex:0 0 auto;min-width:36px}
.tsmembers{padding:16px 20px}
.tsmember{display:flex;align-items:center;gap:11px;padding:9px 0;border-top:1px solid var(--line2)}
.tsmember:first-child{border-top:0}
.tsmember .av2{width:30px;height:30px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:0 0 auto}
.tsmember .nm2{font-size:13px;font-weight:650}
.tsmember .rl{font-size:11px;color:var(--txt3);margin-left:auto}

/* ══ 팀 스페이스 위젯 · 메시지 미리보기형 ══ */
.wg[data-id="team"] .hd{margin-bottom:12px}
.tw-row{display:flex;align-items:flex-start;flex-wrap:wrap;column-gap:9px;row-gap:0;padding:12px 0 8px;border-top:1px solid var(--wgTrack);cursor:pointer}
.tw-members{display:flex;align-items:center;flex:0 0 100%;margin-top:14px;padding-left:1px}
.tw-member{width:28px;height:28px;flex:0 0 28px;display:grid;place-items:center;border:2px solid var(--wgBg);border-radius:50%;color:#fff;font-size:11px;font-weight:750;line-height:1}
.tw-member+.tw-member{margin-left:-6px}
.tw-av{width:28px;height:28px;border-radius:24%;color:#fff;display:grid;place-items:center;font-size:9.5px;font-weight:800;flex:0 0 auto}
.tw-body{min-width:0;flex:1}
.tw-top{display:flex;align-items:baseline;gap:6px}
.tw-nm{font-size:calc(11px * var(--fz));font-weight:750}
.tw-tm{margin-left:auto;font-size:calc(9.5px * var(--fz));color:var(--txt3)}
.tw-snip{font-size:calc(10.5px * var(--fz));color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:6px}
.tw-snip b{color:var(--wgFg);font-weight:650}
.tw-dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex:0 0 auto;margin-top:6px}
/* ══ 타임시트 위젯 ══ */

.view-app .studioHomeRow .studioRemove{position:absolute;right:-8px;top:-8px;display:grid;place-items:center;width:24px;height:24px;min-height:24px;padding:0;border:0;border-radius:50%;background:none;color:var(--txt3);font-size:17px;font-weight:400;line-height:1;z-index:1}
.view-app .studioHomeRow .studioRemove span{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--menuBg);border:1px solid var(--menuLine);box-shadow:0 1px 3px rgba(19,42,70,.07)}
.view-app .studioHomeRow .studioRemove:hover{color:var(--fg);background:none}
.view-app .studioHomeRow .studioRemove:hover span{background:var(--btnBg);border-color:color-mix(in srgb,var(--fg) 24%,var(--menuLine))}
.view-app .studioHomeRow .studioRemove:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
/* Icon-only zone color control */
.view-zone .zoneColorPicker summary{width:34px;height:34px;padding:0;justify-content:center;gap:0;border-color:transparent;background:transparent;border-radius:50%}
.view-zone .zoneColorPicker summary>i{width:18px;height:18px}
.view-zone .zoneColorPicker summary:hover,.view-zone .zoneColorPicker[open] summary{background:var(--btnBg);border-color:var(--menuLine)}
.view-zone .zrow .zdel{min-width:42px;text-align:center}
/* Selected design 3: slim app group list */
.libbody.view-zone .studioApps{padding:18px 20px 24px}
.libbody.view-zone .studioApps>.lsec,.libbody.view-zone .studioApps>.nz{max-width:880px;margin-left:auto;margin-right:auto}
.libbody.view-zone .lsec>h3{font-size:calc(14px * var(--fz));font-weight:700;letter-spacing:0;color:var(--fg);margin-bottom:14px}
.slimGroupList{background:var(--menuBg);border:1px solid var(--menuLine);border-radius:12px}
.libbody.view-zone .slimGroupList .zrow{display:grid;grid-template-columns:32px minmax(100px,180px) minmax(55px,1fr) auto 30px;gap:8px;min-height:50px;padding:7px 12px;margin:0;border:0;border-bottom:1px solid var(--menuLine);border-radius:0;background:transparent}
.libbody.view-zone .slimGroupList .zrow:first-child{border-radius:12px 12px 0 0}
.libbody.view-zone .slimGroupList .zrow:last-child{border-bottom:0;border-radius:0 0 12px 12px}
.libbody.view-zone .slimGroupList .zrow:only-child{border-radius:12px}
.libbody.view-zone .slimGroupList .zrow:hover{background:var(--menuHov)}
.libbody.view-zone .zrow input.zname{width:100%;font-size:calc(12px * var(--fz));font-weight:650;padding:4px 2px}
.libbody.view-zone .zrow .zcount{font-size:calc(10px * var(--fz));opacity:.65}
.libbody.view-zone .zrow .ltg{font-size:calc(10px * var(--fz));padding:5px 10px;min-width:52px;min-height:30px;border-radius:7px;border:1px solid var(--menuLine);background:var(--menuBg);color:var(--txt3)}
.libbody.view-zone .zrow .ltg.on{border-color:transparent;background:color-mix(in srgb,var(--blue) 9%,var(--menuBg));color:var(--blue)}
.libbody.view-zone .zrow .zdel{display:grid;place-items:center;min-width:28px;min-height:30px;padding:0;border-radius:6px;color:var(--txt3);font-size:20px;font-weight:400;opacity:.75}
.libbody.view-zone .zrow .zdel:hover{opacity:1;background:var(--btnBg);color:var(--fg)}
.libbody.view-zone .zoneColorPicker summary{width:30px;height:30px}
.libbody.view-zone .zoneColorPicker summary>i{width:15px;height:15px}
.libbody.view-zone .zoneColorPalette{left:0;right:auto}
.libbody.view-zone .nz{border-style:solid;border-color:var(--menuLine);margin-top:16px;border-radius:12px;padding:14px}
@media(max-width:640px){.libbody.view-zone .studioApps{padding:12px}.libbody.view-zone .slimGroupList .zrow{grid-template-columns:28px minmax(65px,1fr) auto 26px;gap:5px;padding:7px 9px}.libbody.view-zone .zrow .zcount{grid-column:2;grid-row:2}.libbody.view-zone .zrow .zoneColorPicker{grid-row:1/3}.libbody.view-zone .zrow .ltg{grid-column:3;grid-row:1/3}.libbody.view-zone .zrow .zdel{grid-column:4;grid-row:1/3}}
