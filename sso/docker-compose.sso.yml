# ============================================================
#  SH Portal SSO — oauth2-proxy (Microsoft Entra ID)
#  NAS 경로: /volume1/sh-pf/docker/sh-platform/sso/docker-compose.sso.yml
#
#  실행:  cd /volume1/sh-pf/docker/sh-platform/sso && sudo docker-compose -f docker-compose.sso.yml up -d
#  중지:  sudo docker-compose -f docker-compose.sso.yml down
#  로그:  sudo docker logs -f sh-oauth2-proxy
#
#  - 메인 스택(docker-compose.yml)과 별개 프로젝트. nginx·postgres·redis·streamlit 컨테이너는 건드리지 않는다.
#  - Synology Docker는 bridge 통신이 안 되므로 nginx와 같이 host 네트워크로 띄우고,
#    nginx는 127.0.0.1:4180 으로, oauth2-proxy는 127.0.0.1:6379(sh-redis) 로 접근한다.
#  - 세션은 기존 sh-redis(DB 1)에 저장 → 컨테이너를 재시작해도 로그인 유지.
# ============================================================
version: "3.9"

services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    container_name: sh-oauth2-proxy
    restart: unless-stopped
    network_mode: host
    env_file: .env.sso
    environment:
      TZ: Asia/Seoul
      # ── 리슨: nginx(host 모드)만 접근하도록 loopback ──
      OAUTH2_PROXY_HTTP_ADDRESS: "127.0.0.1:4180"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_PROXY_PREFIX: "/oauth2"
      # ── Entra ID (OIDC, 단일 테넌트) ──
      OAUTH2_PROXY_PROVIDER: "oidc"
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: "Microsoft 365"
      # OIDC_ISSUER_URL · REDIRECT_URL · CLIENT_ID · CLIENT_SECRET · COOKIE_SECRET 는 .env.sso 에서 (compose 치환 아님)
      OAUTH2_PROXY_SCOPE: "openid profile email"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"                       # 테넌트 자체가 제한이므로 도메인은 전부 허용
      # oauth2-proxy 는 userinfo.user 에 항상 sub(고유 ID)를 넣고 표시 이름을 따로 주지 않는다.
      # 그래서 "email" 자리에 표시 이름(name 클레임)을 싣고, 실제 이메일은 preferredUsername(UPN)으로 받는다.
      # 포털(loadSsoUser)은 email→이름, preferredUsername→이메일/저장키 로 해석한다.
      OAUTH2_PROXY_OIDC_EMAIL_CLAIM: "name"
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"   # Entra는 email_verified 클레임을 주지 않음
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: "roles"                # 앱 역할(App Role) → groups 로 전달 ('Admin')
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"              # 중간 버튼 화면 없이 바로 Microsoft 로그인
      # ── 세션·쿠키 ──
      OAUTH2_PROXY_SESSION_STORE_TYPE: "redis"
      OAUTH2_PROXY_REDIS_CONNECTION_URL: "redis://127.0.0.1:6379/1"
      OAUTH2_PROXY_COOKIE_NAME: "_sh_portal"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: "lax"
      OAUTH2_PROXY_COOKIE_EXPIRE: "12h"
      OAUTH2_PROXY_COOKIE_REFRESH: "0"
      # ── nginx auth_request 연동: 사용자 정보 헤더 + /oauth2/userinfo ──
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      # ── 로그아웃 후 Microsoft 로그아웃 페이지로 보내기 위해 허용 ──
      OAUTH2_PROXY_WHITELIST_DOMAINS: "login.microsoftonline.com"
      # ── 로그 ──
      OAUTH2_PROXY_REQUEST_LOGGING: "false"
      OAUTH2_PROXY_STANDARD_LOGGING: "true"
      OAUTH2_PROXY_AUTH_LOGGING: "true"
