# ============================================================
#  Nginx 리버스 프록시 — SH Portal (SSO 적용판)
#  NAS 경로: /volume1/sh-pf/docker/sh-platform/nginx/default.conf
#
#  [운영 전제 — SH-AX-INFRA-001]
#  - nginx 컨테이너는 network_mode: host, listen 8080
#  - Streamlit 은 127.0.0.1:8501, oauth2-proxy 는 127.0.0.1:4180 (둘 다 host 모드)
#  - https 는 DSM 역방향 프록시가 종단: https://192.168.100.25:8081 → http://localhost:8080
#
#  [이 판에서 바뀐 것]
#  1. /oauth2/ → oauth2-proxy 로 전달, /oauth2/auth 는 내부 인증 확인용
#  2. 포털 · /audit/ · /ifrs18/ · /data/ · /uploads/ 에 auth_request (미로그인 → Microsoft 로그인)
#  3. http 로 직접 들어온 요청(DSM 을 거치지 않은 8080, 즉 127.0.0.1 이 아닌 곳에서 온 요청)은 https 8081 로 301
#  4. /health 는 게이트·리다이렉트 모두 제외 (기존 헬스체크 유지)
#  XBRL(:4001)·회의실(:3501) 은 이 nginx 밖에 있어 1차 게이트 대상이 아님
#  5. (2026-09-18) /downloads/ — 다운로드 파일·manifest.json. 읽기는 로그인 사용자 전원, 쓰기(PUT/DELETE)는 App Role Admin 만
#     (포털 설정 창의 '다운로드 파일 관리'가 브라우저에서 바로 올림). 폴더 목록은 JSON(autoindex) 으로 응답.
#     쓰기는 sh-dl-writer(127.0.0.1:4181, infra/dl-writer/) 로 프록시 — 이 컨테이너의 html 마운트가 :ro 라서
# ============================================================

upstream streamlit_app {
    server 127.0.0.1:8501;
}

# DSM 역방향 프록시(같은 NAS)를 거친 요청은 항상 127.0.0.1 에서 온다. LAN IP 에서 직접 오면 http 8080 직접 접속.
map $remote_addr $via_dsm {
    default    0;
    127.0.0.1  1;
    ::1        1;
}
# 뒷단(oauth2-proxy·Streamlit)에 알려줄 원래 프로토콜
map $via_dsm $fwd_proto {
    default  $scheme;
    1        https;
}
# https 로 넘길지: DSM 을 거치지 않았고(/health 제외) → 1
map "$via_dsm:$uri" $to_https {
    default        1;
    "~^1:"         0;
    "~:/health$"   0;
}

server {
    listen 8080;
    server_name  _;

    # ── http 직접 접속 → https (DSM 8081) ──
    if ($to_https) {
        return 301 https://$host:8081$request_uri;
    }

    # ── 헬스 체크 (게이트 없음) ──
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"sh-platform","version":"v6-sso"}';
        add_header Content-Type application/json;
    }

    # ── oauth2-proxy: 로그인 시작·콜백·userinfo·sign_out ──
    location /oauth2/ {
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host                    $host;
        proxy_set_header X-Real-IP               $remote_addr;
        proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto       $fwd_proto;
        proxy_set_header X-Forwarded-Host        $host:8081;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }
    # ── 인증 확인 (auth_request 전용, 외부 직접 호출 불가) ──
    location = /oauth2/auth {
        internal;
        proxy_pass               http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host  $host:8081;
        proxy_set_header X-Original-URI    $request_uri;
        proxy_set_header Content-Length    "";
        proxy_pass_request_body            off;
    }
    # ── 관리자 확인 (auth_request 전용): oauth2-proxy 가 roles 에 Admin 이 없으면 401 ──
    location = /oauth2/auth_admin {
        internal;
        proxy_pass               http://127.0.0.1:4180/oauth2/auth?allowed_groups=Admin;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host  $host:8081;
        proxy_set_header X-Original-URI    $request_uri;
        proxy_set_header Content-Length    "";
        proxy_pass_request_body            off;
    }
    # ── 미로그인(401) → 로그인 시작, 끝나면 원래 주소로 ──
    location @signin {
        return 302 /oauth2/start?rd=$request_uri;
    }

    # ── SH Portal (메인) ──
    location / {
        auth_request /oauth2/auth;
        error_page 401 = @signin;
        root  /usr/share/nginx/html/portal;
        index index.html;
        add_header Cache-Control "no-store";
    }

    # ── 다운로드 파일 + 목록(manifest.json) — 읽기: 로그인 사용자 전원 ──
    #    폴더 자체(/downloads/)를 열면 파일 목록을 JSON 으로 돌려준다(관리 화면이 씀).
    #    GET/HEAD 가 아닌 요청(PUT·DELETE)은 아래 내부 location 으로 넘겨 관리자만 통과시킨다.
    location /downloads/ {
        auth_request /oauth2/auth;
        error_page 401 = @signin;
        alias /usr/share/nginx/html/portal/downloads/;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-store";
        client_max_body_size 500m;
        if ($request_method !~ ^(GET|HEAD)$) { rewrite ^ /_dlw$uri last; }
    }
    # ── 다운로드 파일 쓰기(PUT/DELETE) — App Role Admin 만. 하위 폴더·숨김 파일(.으로 시작)·폴더 자체는 거부.
    #    sh-nginx 는 포털 폴더가 읽기 전용(:ro)이라 직접 못 쓴다 → 관리자 확인 후 sh-dl-writer(127.0.0.1:4181, infra/dl-writer/)로 넘긴다 ──
    location /_dlw/downloads/ {
        internal;
        if ($uri ~ "^/_dlw/downloads/(.*/|\.|$)") { return 403; }
        auth_request /oauth2/auth_admin;
        client_max_body_size 500m;
        proxy_pass         http://127.0.0.1:4181/downloads/;
        proxy_set_header   Host $host;
        proxy_read_timeout 300;
        add_header Cache-Control "no-store";
    }

    # ── SH Audit Platform ──
    location /audit/ {
        auth_request /oauth2/auth;
        error_page 401 = @signin;
        alias /usr/share/nginx/html/audit/;
        index index.html;
        try_files $uri $uri/ /audit/index.html;
    }

    # ── K-IFRS 1118호 ──
    location /ifrs18/ {
        auth_request /oauth2/auth;
        error_page 401 = @signin;
        alias /usr/share/nginx/html/ifrs18/;
        index index.html;
        try_files $uri $uri/ /ifrs18/index.html;
    }

    # ── 금융기관 조회 (Streamlit, WebSocket) ──
    location /data/ {
        auth_request /oauth2/auth;
        error_page 401 = @signin;
        proxy_pass http://streamlit_app/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
    location /data/_stcore/ {
        auth_request /oauth2/auth;
        error_page 401 = @signin;
        proxy_pass http://streamlit_app/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # ── 업로드 파일 ──
    location /uploads/ {
        auth_request /oauth2/auth;
        error_page 401 = @signin;
        alias /app/uploads/;
        autoindex off;
    }

    # ── 에러 페이지 ──
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        return 503 '<!DOCTYPE html><html><body style="font-family:sans-serif;text-align:center;padding:80px">
        <h1 style="color:#E81E25">503</h1>
        <p>서비스 점검 중입니다. 잠시 후 다시 시도해 주세요.</p>
        </body></html>';
        add_header Content-Type "text/html; charset=utf-8";
    }
}
