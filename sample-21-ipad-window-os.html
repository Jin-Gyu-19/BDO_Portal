function cellAt(x,y){
  const m=cellMetrics();
  return {c:Math.min(COLS,Math.max(1,Math.floor((x-m.left)/(m.w+GAP))+1)),
          r:Math.min(ROWS,Math.max(1,Math.floor((y-m.top)/(m.h+GAP))+1))};
}
function hit(el,x,y,pad){
  const r=el.getBoundingClientRect();
  return x>=r.left-pad && x<=r.right+pad && y>=r.top-pad && y<=r.bottom+pad;
}
function indexAt(c,x,y){
  const items=[...c.querySelectorAll('[data-id]')];
  for(let i=0;i<items.length;i++){
    const r=items[i].getBoundingClientRect();
    if(y<r.bottom && x<r.left+r.width/2) return i;
  }
  return items.length;
}
function clearSwapHint(){ hgrid.querySelectorAll('.swaptarget').forEach(n=>n.classList.remove('swaptarget')); }

function beginDrag(e,el){
  const k=el.dataset.k, id=el.dataset.id;
  const fromDock=!!el.closest('.dock');
  const item = fromDock ? {k:'a',id,r:0,c:0,rs:1,cs:1}
                        : layout.find(o=>uid(o)===el.dataset.uid);
  const face=(k==='w'||k==='z')?el:(fromDock?el:el.querySelector('.ish'));
  const r=face.getBoundingClientRect();

  const ghost=document.createElement('div');
  ghost.className = (k==='w'||k==='z') ? 'ghost wgg' : (fromDock?'ghost':'ghost ap');
  ghost.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
  const clone=face.cloneNode(true);
  clone.style.width=r.width+'px'; clone.style.height=r.height+'px'; clone.style.margin='0';
  ghost.appendChild(clone);
  document.body.appendChild(ghost);

  const slot=document.createElement('div');
  slot.className='slot'+(item.rs===1&&item.cs===1&&item.k==='a'?' icon-slot':k==='z'?' zone-slot':'');

  /* 존을 옮기면 그 위의 앱도 같이 이동 */
  const carried = k==='z' ? zoneApps(item).map(o=>({...o, dr:o.r-item.r, dc:o.c-item.c})) : [];
  /* 여러 칸짜리 항목은 '잡은 칸'이 어디였는지 기억해 두어, 놓을 때 그 칸이 커서 아래로 오게 한다 */
  let grab={dr:0,dc:0};
  if(!fromDock){
    const g=cellAt(e.clientX,e.clientY);
    grab={dr:Math.min(item.rs-1,Math.max(0,g.r-item.r)), dc:Math.min(item.cs-1,Math.max(0,g.c-item.c))};
  }
  drag={item:{...item}, origin:item, fromDock, ghost, slot, target:null, swap:null, carried, grab,
        dockIdx:fromDock?dockOrder.indexOf(id):-1,
        offX:e.clientX-r.left, offY:e.clientY-r.top};

  if(fromDock){ dockOrder.splice(drag.dockIdx,1); renderDock(); }
  else {
    const gone=new Set([item, ...carried.map(c=>layout.find(o=>uid(o)===uid(c)))]);
    layout=layout.filter(o=>!gone.has(o)); renderGrid();
  }
  document.body.classList.add('editing');
}
function moveDrag(e){
  const {ghost,item,slot}=drag;
  ghost.style.left=(e.clientX-drag.offX)+'px';
  ghost.style.top =(e.clientY-drag.offY)+'px';
  clearSwapHint();

  /* 앱 아이콘은 Dock에도 놓을 수 있다 */
  if(item.k==='a' && hit(dock,e.clientX,e.clientY,18) && dockOrder.length<DOCK_MAX){
    const kids=[...dock.querySelectorAll('[data-id]')];
    dock.insertBefore(slot, kids[indexAt(dock,e.clientX,e.clientY)]||null);
    slot.classList.remove('bad');
    drag.target='dock'; drag.swap=null; return;
  }
  if(hit(hgrid,e.clientX,e.clientY,20)){
    const cell=cellAt(e.clientX,e.clientY);
    const box={...item,
      r:Math.max(1,Math.min(cell.r-drag.grab.dr, ROWS-item.rs+1)),
      c:Math.max(1,Math.min(cell.c-drag.grab.dc, COLS-item.cs+1))};
    const bump=collide(box);
    const carriedOK = drag.carried.every(c=>{
      const nb={...c, r:box.r+c.dr, c:box.c+c.dc};
      return fits(nb) && !collide(nb).length;
    });
    const swappable = !drag.fromDock && item.k!=='z' && bump.length===1 && bump[0].k===item.k
                      && bump[0].rs===item.rs && bump[0].cs===item.cs;
    if((bump.length===0 && carriedOK) || swappable){
      slot.classList.remove('bad');
      slot.style.gridArea=`${box.r} / ${box.c} / span ${box.rs} / span ${box.cs}`;
      hgrid.appendChild(slot);
      drag.target=box; drag.swap=swappable?bump[0]:null;
      if(swappable) hgrid.querySelector(`[data-uid="${uid(bump[0])}"]`)?.classList.add('swaptarget');
      return;
    }
  }
  slot.remove(); drag.target=null; drag.swap=null;
}
function endDrag(){
  const {item,origin,fromDock,slot,ghost,target,swap}=drag;
  if(target==='dock'){
    const idx=[...dock.children].filter(n=>n.dataset.id||n===slot).indexOf(slot);
    dockOrder.splice(Math.max(0,idx),0,item.id);
  }else if(target){
    if(swap){ swap.r=fromDock?swap.r:origin.r; swap.c=fromDock?swap.c:origin.c; }
    layout.push({...item, r:target.r, c:target.c});
    drag.carried.forEach(c=>layout.push({k:c.k,id:c.id,rs:1,cs:1, r:target.r+c.dr, c:target.c+c.dc}));
  }else{                                   /* 유효한 자리가 없으면 원위치 */
    if(fromDock) dockOrder.splice(Math.max(0,drag.dockIdx),0,item.id);
    else {
      layout.push({...origin});
      drag.carried.forEach(c=>layout.push({k:c.k,id:c.id,rs:1,cs:1, r:origin.r+c.dr, c:origin.c+c.dc}));
    }
  }
  slot.remove(); ghost.remove(); clearSwapHint();
  document.body.classList.remove('editing');
  drag=null;
  renderGrid(); renderDock(); saveLayout();
  justDragged=true; setTimeout(()=>justDragged=false,0);
}

/* ── 위젯 크기 조정 — 격자 칸 단위, 다른 위젯과 겹치면 더 커지지 않는다 ── */
function startResize(e,handle){
  const el=handle.closest('.wg,.zone'), u=el.dataset.uid;
  const item=layout.find(o=>uid(o)===u); if(!item) return;
  const isZone=item.k==='z';
  const m=cellMetrics(), before=item.rs+'x'+item.cs;
  const x0=m.left+(item.c-1)*(m.w+GAP), y0=m.top+(item.r-1)*(m.h+GAP);
  el.classList.add('rz');
  handle.setPointerCapture(e.pointerId);
  const apply=(rs,cs)=>{
    item.rs=rs; item.cs=cs;
    el.style.gridArea=`${item.r} / ${item.c} / span ${rs} / span ${cs}`;
    el.dataset.r=rs; el.dataset.c=cs;
    if(isZone){ const n=el.querySelector('.zl small'); if(n) n.textContent=zoneApps(item).length; return; }
    el.querySelector('.szl').textContent=rs+' × '+cs;
    fitWidget(el);
  };
  const move=ev=>{
    ev.preventDefault();
    const csT=Math.max(1,Math.min(COLS-item.c+1,Math.ceil((ev.clientX-x0+GAP/2)/(m.w+GAP))));
    const rsT=Math.max(1,Math.min(ROWS-item.r+1,Math.ceil((ev.clientY-y0+GAP/2)/(m.h+GAP))));
    /* 커서가 가리킨 크기에 가장 가까우면서 다른 항목과 겹치지 않는 크기를 고른다 */
    let best=null;
    const minC=1;                                /* 위젯도 1칸까지 줄일 수 있다 */
    for(let R=rsT;R>=1;R--) for(let C=csT;C>=minC;C--){
      if(collide({...item,rs:R,cs:C},item).length) continue;
      const d=(rsT-R)+(csT-C);
      if(!best||d<best.d||(d===best.d&&R*C>best.rs*best.cs)) best={rs:R,cs:C,d};
    }
    if(!best) return;
    if(best.rs!==item.rs||best.cs!==item.cs) apply(best.rs,best.cs);
  };
  const up=()=>{
    handle.removeEventListener('pointermove',move);
    handle.removeEventListener('pointerup',up);
    handle.removeEventListener('pointercancel',up);
    el.classList.remove('rz');
    if(item.rs+'x'+item.cs!==before) saveLayout();
    justDragged=true; setTimeout(()=>justDragged=false,0);
  };
  handle.addEventListener('pointermove',move);
  handle.addEventListener('pointerup',up);
  handle.addEventListener('pointercancel',up);
}

document.addEventListener('pointerdown',e=>{
  if(compact){ longPress(e); return; }         /* 좁은 화면: 끌어 옮기기 대신 길게 눌러 메뉴 */
  const rsz=e.target.closest('.rsz');
  if(rsz){ e.preventDefault(); e.stopPropagation(); startResize(e,rsz); return; }
  const el=e.target.closest('.hgrid [data-uid],.dk[data-id]');
  if(!el||e.button) return;
  const sx=e.clientX, sy=e.clientY;
  let started=false;
  const move=ev=>{
    if(!started){
      if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)<6) return;
      started=true; beginDrag(ev,el);
    }
    ev.preventDefault(); moveDrag(ev);
  };
  const up=()=>{
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',up);
    document.removeEventListener('pointercancel',up);
    if(started) endDrag();
  };
  document.addEventListener('pointermove',move);
  document.addEventListener('pointerup',up);
  document.addEventListener('pointercancel',up);
});


/* 터치로 홈 항목을 0.5초 길게 누르면 우클릭 메뉴가 열린다 (iOS는 contextmenu 이벤트가 없다) */
function longPress(e){
  if(e.pointerType!=='touch') return;
  const el=e.target.closest('.hgrid [data-uid]'); if(!el) return;
  const sx=e.clientX, sy=e.clientY;
  let t=setTimeout(()=>{ t=null; showCmenuFor(el,sx,sy); },500);
  const off=()=>{ if(t) clearTimeout(t); document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',off); document.removeEventListener('pointercancel',off); };
  const mv=ev=>{ if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>10) off(); };
  document.addEventListener('pointermove',mv); document.addEventListener('pointerup',off); document.addEventListener('pointercancel',off);
}
/* ══════════ 창 시스템 ══════════ */
const wins=new Map();            // id -> {el, state, restore}
let zTop=100, cascade=0;
const snapEl=document.getElementById('snap');
const homeEl=document.getElementById('home');
const MIN_W=320, MIN_H=220, EDGE=26;
/* 좁은 화면이면 창이 상태 표시줄과 Dock 사이를 꽉 채운다 */
const STATUS_H=38;
const area=()=>compact
  ? {x:0, y:STATUS_H, w:VW(), h:VH()-STATUS_H-84}
  : {x:8, y:STATUS_H+6, w:VW()-16, h:VH()-STATUS_H-6-88};
/* 최대화 영역: 상태 표시줄(시간·날짜·프로필)만 남기고 화면 전부 */
const fullArea=()=>({x:0, y:STATUS_H, w:VW(), h:VH()-STATUS_H});

function syncHome(){
  const open=[...wins.values()].some(w=>w.state!=='min');
  homeEl.classList.toggle('pushed',open);
}
function markDock(){
  document.querySelectorAll('[data-dock]').forEach(d=>d.classList.toggle('on',
    d.dataset.dock==='memo' ? (stickiesOn||wins.has('memo')) : wins.has(d.dataset.dock)));
}
/* 최대화 시 Dock 감추기, 창이 2개 이상일 때 4분할 버튼 노출 */
/* 창을 작업 영역에 꽉 채운다 (compact 전용, 이전 크기는 넓은 화면으로 돌아갈 때 복원) */
function fillArea(w){
  const ar=fullArea(), el=w.el;
  if(w.state!=='max') w.restore={left:el.style.left,top:el.style.top,width:el.style.width,height:el.style.height};
  Object.assign(el.style,{left:ar.x+'px',top:ar.y+'px',width:ar.w+'px',height:ar.h+'px'});
  w.state='max';
}
/* 스냅된 창이 2개 이상이면 상태 표시줄 아래를 통째로 나눠 쓴다 (1개뿐이면 Dock 자리를 남긴다) */
const snapped=()=>[...wins.values()].filter(w=>w.state==='snap'&&w.zone);
const snapFull=()=>snapped().length>=2;
function relayoutSnaps(){
  const list=snapped(), base=list.length>=2?fullArea():area();
  list.forEach(w=>{ const r=zoneRect(w.zone,base);
    Object.assign(w.el.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'}); });
}
function syncChrome(){
  const live=[...wins.values()].filter(w=>w.state!=='min');
  const full=snapFull();
  document.body.classList.toggle('dockhide', live.some(w=>w.state==='max') || full);
  wins.forEach(v=>{ v.el.classList.toggle('max', v.state==='max');
    v.el.classList.toggle('flush', full && v.state==='snap'); });
  tile4Btn.classList.toggle('show', live.length>=2);
}
function focusWin(id){
  const w=wins.get(id); if(!w) return;
  w.el.style.zIndex=++zTop;
  wins.forEach((v,k)=>v.el.classList.toggle('active',k===id));
}
/* 남아 있는 창 중 가장 위의 창으로 포커스 이동 */
function focusTop(){
  let top=null,tz=-1;
  wins.forEach((v,k)=>{ if(v.state==='min') return;
    const z=+v.el.style.zIndex||0; if(z>tz){tz=z;top=k;} });
  wins.forEach(v=>v.el.classList.remove('active'));
  if(top) focusWin(top);
}
function openApp(id){
  const a=APPS[id]; if(!a) return;
  if(wins.has(id)){
    const w=wins.get(id);
    if(w.state==='min'){ w.el.style.display='flex'; w.el.classList.remove('min'); w.state='normal'; }
    focusWin(id); syncHome(); return;
  }
  const ar=area();
  const w=Math.min((a.w||720)*1.3, ar.w-40), h=Math.min((a.h||520)*1.3, ar.h-30);
  const off=(cascade++%6)*28;
  let x=ar.x+Math.max(20,(ar.w-w)/2-120)+off, y=ar.y+Math.max(14,(ar.h-h)/2-30)+off;
  x=Math.min(x, ar.x+ar.w-w-10); y=Math.min(y, ar.y+ar.h-h-10);

  const el=document.createElement('div');
  el.className='win active';
  el.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:${++zTop}`;
  el.innerHTML=`
    <div class="wtb">
      <div class="tt"><span class="mk${hasIco(id)?' img':''}" style="background:${a.bg};${a.fg?`color:${a.fg}`:''};${icoBg(id)}">${hasIco(id)?'':a.short.slice(0,4)}</span>
        <span class="n">${a.name}</span><span class="s">${a.sub||''}</span></div>
      <div class="wctl">
        <button data-act="min" title="최소화" aria-label="최소화"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
        <button data-act="max" title="최대화" aria-label="최대화"><svg viewBox="0 0 12 12"><rect x="2.4" y="2.4" width="7.2" height="7.2"/></svg></button>
        <button class="close" data-act="close" title="닫기" aria-label="닫기"><svg viewBox="0 0 12 12"><path d="M2.6 2.6l6.8 6.8M9.4 2.6l-6.8 6.8"/></svg></button>
      </div>
    </div>
    <div class="wbody">${a.body?a.body():`
      <div class="empty"><div class="bigicon${hasIco(id)?' img':''}" style="background:${a.bg};${icoBg(id)}">${hasIco(id)?'':a.short}</div>
      <div class="t">${a.name}</div>
      <div class="d">${a.soon?'아직 준비 중인 App입니다. 오픈 시 이 창에서 바로 실행됩니다.':'구독 App입니다. 외부 서비스 창이 이 자리에 임베드됩니다.'}<br>${a.sub}</div></div>`}</div>
    ${['n','s','w','e','nw','ne','sw','se'].map(d=>`<div class="rs ${d}" data-rs="${d}"></div>`).join('')}`;
  document.body.appendChild(el);
  syncThemeUI();                              /* 설정 창의 배경 카드 선택 상태 반영 */
  if(id==='memo') paintMemo();
  wins.set(id,{el,state:'normal',restore:null,zone:null});
  if(compact){ fillArea(wins.get(id)); scrollTo(0,0); }   /* 좁은 화면에서는 전체 화면 시트로 */
  bindWindow(id,el);
  focusWin(id); markDock(); syncHome(); syncChrome();
}
function closeApp(id){
  const w=wins.get(id); if(!w) return;
  w.el.classList.add('closing');
  setTimeout(()=>{w.el.remove(); wins.delete(id); markDock(); syncHome(); focusTop(); syncChrome(); relayoutSnaps();},170);
}
function minApp(id){
  const w=wins.get(id); if(!w) return;
  w.el.classList.add('min'); w.state='min'; w.zone=null;
  w.el.classList.remove('active');
  setTimeout(()=>{ if(w.state==='min') w.el.style.display='none'; },210);
  syncHome(); focusTop(); syncChrome();
}
function maxApp(id){
  const w=wins.get(id); if(!w) return;
  const el=w.el, ar=fullArea();
  el.classList.add('snapping');
  w.zone=null;
  if(w.state==='max' && w.restore){
    Object.assign(el.style,w.restore); w.state='normal'; w.restore=null;
  }else{
    w.restore={left:el.style.left,top:el.style.top,width:el.style.width,height:el.style.height};
    Object.assign(el.style,{left:ar.x+'px',top:ar.y+'px',width:ar.w+'px',height:ar.h+'px'});
    w.state='max';
  }
  setTimeout(()=>el.classList.remove('snapping'),200);
  paintMaxBtn(id); syncChrome();
}
/* 최대화 상태면 '이전 크기로 복원' 아이콘(겹친 사각형)으로 바꿈 */
const ICON_MAX='<svg viewBox="0 0 12 12"><rect x="2.4" y="2.4" width="7.2" height="7.2"/></svg>';
const ICON_RESTORE='<svg viewBox="0 0 12 12"><rect x="2" y="4" width="6" height="6"/><path d="M4.2 4V2h5.8v5.8H8"/></svg>';
function paintMaxBtn(id){
  const w=wins.get(id); if(!w) return;
  const b=w.el.querySelector('[data-act="max"]'); if(!b) return;
  const on=w.state==='max';
  b.innerHTML=on?ICON_RESTORE:ICON_MAX;
  b.title=b.ariaLabel=on?'이전 크기로':'최대화';
}
function snapTo(id,zone){
  const w=wins.get(id); if(!w) return;
  if(w.state!=='max' && !w.restore) w.restore={left:w.el.style.left,top:w.el.style.top,width:w.el.style.width,height:w.el.style.height};
  w.el.classList.add('snapping');
  w.state='snap'; w.zone=zone;
  relayoutSnaps();                              /* 나머지 스냅 창 크기도 함께 맞춘다 */
  setTimeout(()=>w.el.classList.remove('snapping'),200);
  paintMaxBtn(id); syncChrome();
}
function zoneRect(zone,base){
  const a=base||(snapFull()?fullArea():area()), hw=a.w/2-4, hh=a.h/2-4;
  if(zone==='max')   return fullArea();
  if(zone==='left')  return {x:a.x,y:a.y,w:hw,h:a.h};
  if(zone==='right') return {x:a.x+a.w-hw,y:a.y,w:hw,h:a.h};
  if(zone==='q1')    return {x:a.x,y:a.y,w:hw,h:hh};                     /* 좌상 */
  if(zone==='q2')    return {x:a.x+a.w-hw,y:a.y,w:hw,h:hh};             /* 우상 */
  if(zone==='q3')    return {x:a.x,y:a.y+a.h-hh,w:hw,h:hh};             /* 좌하 */
  if(zone==='q4')    return {x:a.x+a.w-hw,y:a.y+a.h-hh,w:hw,h:hh};      /* 우하 */
  return null;
}
/* ── 끌어서 스냅: 위=최대화, 좌우 가장자리=반화면, 네 모서리=4분할 ── */
function zoneAt(x,y){
  const a=fullArea(), CX=Math.max(160,a.w*0.16), CY=Math.max(130,a.h*0.3);
  if(y<=a.y+6)           return x<a.x+CX?'q1':x>a.x+a.w-CX?'q2':'max';
  if(y>=a.y+a.h-6)       return x<a.x+CX?'q3':x>a.x+a.w-CX?'q4':null;
  if(x<=a.x+EDGE)        return y<a.y+CY?'q1':y>a.y+a.h-CY?'q3':'left';
  if(x>=a.x+a.w-EDGE)    return y<a.y+CY?'q2':y>a.y+a.h-CY?'q4':'right';
  return null;
}
/* 미리보기 크기: 이미 스냅된 다른 창이 있으면 결과와 같게 꽉 찬 영역으로 */
const previewBase=id=>[...wins.entries()].some(([k,v])=>k!==id&&v.state==='snap'&&v.zone)?fullArea():area();
/* 열려 있는 창을 최대 4개까지 4분할로 정렬 */
function tileQuarters(){
  const open=[...wins.entries()].filter(([,v])=>v.state!=='min')
    .sort((a,b)=>(+b[1].el.style.zIndex||0)-(+a[1].el.style.zIndex||0)).slice(0,4);
  if(!open.length) return;
  const zs=open.length===1?['max']:open.length===2?['left','right']:['q1','q2','q3','q4'];
  open.forEach(([id],i)=>snapTo(id,zs[i]));
  toast(open.length>=3?'창을 4분할로 정렬했습니다':'창을 좌우로 정렬했습니다');
}

function bindWindow(id,el){
  const w=wins.get(id);
  el.addEventListener('pointerdown',()=>focusWin(id),true);

  /* 트래픽 라이트 */
  el.querySelector('.wctl').addEventListener('click',e=>{
    const b=e.target.closest('[data-act]'); if(!b) return;
    e.stopPropagation();
    ({close:closeApp,min:minApp,max:maxApp})[b.dataset.act](id);
  });

  /* 타이틀바 드래그 + 스냅 */
  const tb=el.querySelector('.wtb');
  tb.addEventListener('dblclick',()=>{ if(!compact) maxApp(id); });
  tb.addEventListener('pointerdown',e=>{
    if(compact || e.target.closest('.wctl')) return;
    e.preventDefault(); tb.setPointerCapture(e.pointerId);
    let sx=e.clientX, sy=e.clientY;
    let ox=el.offsetLeft, oy=el.offsetTop, moved=false, zone=null;

    const move=ev=>{
      const dx=ev.clientX-sx, dy=ev.clientY-sy;
      if(!moved && Math.abs(dx)+Math.abs(dy)<3) return;
      /* 최대화·스냅 상태에서 끌면 원래 크기로 복귀하며 커서를 따라감 */
      if(!moved && (w.state==='max'||w.state==='snap') && w.restore){
        const rw=parseFloat(w.restore.width);
        Object.assign(el.style,{width:w.restore.width,height:w.restore.height});
        ox=ev.clientX-rw/2; oy=ev.clientY-20; sx=ev.clientX; sy=ev.clientY;
        w.state='normal'; w.restore=null; w.zone=null; syncChrome(); relayoutSnaps();
      }
      moved=true;
      const ar=area();
      let nx=ox+(ev.clientX-sx), ny=oy+(ev.clientY-sy);
      nx=Math.max(ar.x-el.offsetWidth+120, Math.min(nx, ar.x+ar.w-120));
      ny=Math.max(ar.y-2, Math.min(ny, ar.y+ar.h-40));
      el.style.left=nx+'px'; el.style.top=ny+'px';

      /* 위 = 최대화, 좌우 가장자리 = 반화면, 네 모서리 = 4분할 */
      zone=zoneAt(ev.clientX,ev.clientY);
      const r=zone&&zoneRect(zone,zone==='max'?fullArea():previewBase(id));
      if(r){ Object.assign(snapEl.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'});
             snapEl.classList.add('show'); }
      else snapEl.classList.remove('show');
    };
    const up=ev=>{
      tb.releasePointerCapture(e.pointerId);
      tb.removeEventListener('pointermove',move); tb.removeEventListener('pointerup',up);
      snapEl.classList.remove('show');
      if(zone==='max') maxApp(id);
      else if(zone) snapTo(id,zone);
    };
    tb.addEventListener('pointermove',move); tb.addEventListener('pointerup',up);
  });

  /* 8방향 리사이즈 */
  el.querySelectorAll('[data-rs]').forEach(h=>{
    h.addEventListener('pointerdown',e=>{
      e.preventDefault(); e.stopPropagation(); h.setPointerCapture(e.pointerId);
      const dir=h.dataset.rs, sx=e.clientX, sy=e.clientY;
      const ox=el.offsetLeft, oy=el.offsetTop, ow=el.offsetWidth, oh=el.offsetHeight;
      const ar=area();
      if(w.state!=='normal'){ w.state='normal'; w.restore=null; w.zone=null; syncChrome(); relayoutSnaps(); }
      const move=ev=>{
        const dx=ev.clientX-sx, dy=ev.clientY-sy;
        let x=ox,y=oy,ww=ow,hh=oh;
        if(dir.includes('e')) ww=Math.max(MIN_W,Math.min(ow+dx, ar.x+ar.w-ox));
        if(dir.includes('s')) hh=Math.max(MIN_H,Math.min(oh+dy, ar.y+ar.h-oy));
        if(dir.includes('w')){ ww=Math.max(MIN_W,Math.min(ow-dx, ox+ow-ar.x)); x=ox+ow-ww; }
        if(dir.includes('n')){ hh=Math.max(MIN_H,Math.min(oh-dy, oy+oh-ar.y)); y=oy+oh-hh; }
        Object.assign(el.style,{left:x+'px',top:y+'px',width:ww+'px',height:hh+'px'});
      };
      const up=()=>{ h.releasePointerCapture(e.pointerId);
        h.removeEventListener('pointermove',move); h.removeEventListener('pointerup',up); };
      h.addEventListener('pointermove',move); h.addEventListener('pointerup',up);
    });
  });
}

/* ══════════ 스포트라이트 검색 ══════════ */
const spot=document.getElementById('spot'), spotq=document.getElementById('spotq'),
      spotres=document.getElementById('spotres');
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const chosung=t=>[...t].map(ch=>{const c=ch.charCodeAt(0)-0xAC00;
  return c>=0&&c<11172?CHO[Math.floor(c/588)]:ch}).join('');

/* 검색 대상: 앱 · 진행 중 프로젝트 · 공지 · 설정 */
function buildIndex(){
  const ix=[];
  Object.entries(APPS).forEach(([id,a])=>ix.push(
    {t:a.name, s:a.sub||'', kind:'앱', g:a.bg, fg:a.fg, mark:a.short, ico:icoBg(id), run:()=>openApp(id)}));
  PROJ.forEach(pr=>ix.push(
    {t:pr[1], s:pr[2], kind:'프로젝트', g:pr[7]||G.aud, mark:pr[0], run:()=>openApp('aud')}));
  [['ISQM1 2026년 품질관리 보고서 작성 안내','품질관리본부 · 04/03'],
   ['SH Audit Platform 기초정보 기능 오픈','IT본부 · 04/02'],
   ['4월 파트너 월례회의 (15일 14시)','경영지원실 · 04/01'],
   ['삼일 TAX Agent 법인 구독 완료','경영지원실 · 03/28'],
   ['내부회계관리제도 감사 매뉴얼 v3 배포','품질관리본부 · 03/25']]
   .forEach(n=>ix.push({t:n[0], s:n[1], kind:'공지', g:G.notice, mark:'공지', run:()=>openApp('notice')}));
  [['배경 테마 바꾸기','화이트 · 소프트 · 미스트 · 다크'],
   ['홈 화면 배치 초기화','아이콘·위젯을 기본값으로']]
   .forEach(n=>ix.push({t:n[0], s:n[1], kind:'설정', g:G.set, mark:'설정', run:()=>openApp('settings')}));
  return ix;
}
let INDEX=[], hits=[], sel=0;
const isCho=k=>[...k].every(ch=>CHO.includes(ch));
function match(q){
  const k=q.trim().toLowerCase(); if(!k) return INDEX.slice(0,7);
  const cho=isCho(k);                       /* 'ㅇㅍㅌㅋ' 처럼 초성만 입력했을 때만 초성 검색 */
  const scored=[];
  INDEX.forEach(o=>{
    const name=o.t.toLowerCase(), rest=(o.s+' '+o.mark).toLowerCase();
    let sc=-1;
    if(name.startsWith(k)) sc=0;
    else if(name.includes(k)) sc=1;
    else if(rest.includes(k)) sc=2;
    else if(cho && chosung(name).includes(k)) sc=3;
    else if(cho && chosung(rest).includes(k)) sc=4;
    if(sc>=0) scored.push({o,sc});
  });
  return scored.sort((a,b)=>a.sc-b.sc).slice(0,8).map(x=>x.o);
}
function paintSpot(){
  spotres.innerHTML = hits.length ? hits.map((o,i)=>
    `<button class="sres${i===sel?' sel':''}" data-i="${i}">
       <span class="si${o.ico?' img':''}" style="--g:${o.g};${o.fg?`color:${o.fg}`:''};${o.ico||''}">${o.ico?'':o.mark}</span>
       <span><span class="st">${o.t}</span><span class="ss" style="display:block">${o.s}</span></span>
       <span class="sk">${o.kind}</span>
     </button>`).join('')
    : '<div class="spotempty">일치하는 항목이 없습니다</div>';
}
function openSpot(){
  closeLib();
  if(!INDEX.length) INDEX=buildIndex();
  hits=match(''); sel=0; paintSpot();
  spot.classList.add('on'); spotq.value=''; setTimeout(()=>spotq.focus(),30);
}
function closeSpot(){ spot.classList.remove('on'); spotq.blur(); }
const spotOpen=()=>spot.classList.contains('on');
function runSel(){
  const o=hits[sel]; if(!o) return;
  closeSpot(); o.run();
}
document.getElementById('dockSearch').addEventListener('click',e=>{ e.stopPropagation(); openSpot(); });
spotq.addEventListener('input',()=>{ hits=match(spotq.value); sel=0; paintSpot(); });
spotres.addEventListener('click',e=>{
  const b=e.target.closest('.sres'); if(!b) return;
  sel=+b.dataset.i; runSel();
});
spot.addEventListener('pointerdown',e=>{ if(!e.target.closest('.spotbox')) closeSpot(); });
spotq.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    if(!hits.length) return;
    sel=(sel+(e.key==='ArrowDown'?1:hits.length-1))%hits.length;
    paintSpot();
    spotres.querySelector('.sel')?.scrollIntoView({block:'nearest'});
  }
  else if(e.key==='Enter'){ e.preventDefault(); runSel(); }
  else if(e.key==='Escape'){ e.preventDefault(); closeSpot(); }
});

/* 홈에 추가: 카테고리 구역 안 빈 칸 → 없으면 격자 첫 빈 칸 */
function freeCellIn(box){
  for(let r=box.r;r<box.r+box.rs;r++) for(let c=box.c;c<box.c+box.cs;c++){
    const cell={k:'a',r,c,rs:1,cs:1};
    if(!collide(cell).length) return cell;
  }
  return null;
}
function addToHome(id){
  if(onHome(id)) return;
  const zone=layout.find(o=>o.k==='z'&&o.id===APP_CAT[id]);
  let cell=zone?freeCellIn(zone):null;
  /* 자기 구역이 꽉 찼으면 다른 구역 안은 피해서 빈 칸을 찾고, 그래도 없으면 아무 빈 칸 */
  if(!cell){
    const zs=layout.filter(o=>o.k==='z');
    outer: for(let r=1;r<=ROWS;r++) for(let c=1;c<=COLS;c++){
      const cand={k:'a',r,c,rs:1,cs:1};
      if(!collide(cand).length && !zs.some(z=>within(cand,z))){ cell=cand; break outer; }
    }
  }
  if(!cell) cell=freeCellIn({r:1,c:1,rs:ROWS,cs:COLS});
  if(!cell){ toast('홈에 빈 칸이 없습니다. 위젯이나 구역을 줄여 주세요'); return; }
  layout.push({k:'a',id,r:cell.r,c:cell.c,rs:1,cs:1});
  renderGrid(); saveLayout();
  toast(APPS[id].name+'을(를) 홈'+(zone&&within(cell,zone)?' · '+zones[zone.id].n+' 구역':'')+'에 추가했습니다');
}
function removeFromHome(id){
  layout=layout.filter(o=>!(o.k==='a'&&o.id===id));
  renderGrid(); saveLayout();
  toast(APPS[id].name+'을(를) 홈에서 뺐습니다 (모든 App에는 남아 있어요)');
}
/* 위젯 · 구역 추가/제거 */
const onHomeW=id=>layout.some(o=>o.k==='w'&&o.id===id);
const onHomeZ=id=>layout.some(o=>o.k==='z'&&o.id===id);
/* 격자에서 rs×cs 크기의 빈 자리를 찾는다 (strict: 구역이 앱 위에 겹치는 것도 피함) */
function findFree(k,rs,cs,strict){
  for(let r=1;r<=ROWS-rs+1;r++) for(let c=1;c<=COLS-cs+1;c++){
    const box={k,r,c,rs,cs};
    if(collide(box).length) continue;
    if(strict && k==='z' && zoneApps(box).length) continue;
    return box;
  }
  return null;
}
function addWidget(id){
  if(onHomeW(id)) return;
  const m=WG_META[id];
  const box=findFree('w',m.rs,m.cs) || findFree('w',1,Math.min(2,m.cs));
  if(!box){ toast('홈에 '+m.rs+' × '+m.cs+' 칸 빈 자리가 없습니다. 다른 항목을 줄이거나 빼 주세요'); return; }
  layout.push({...box,id}); renderGrid(); saveLayout();
  toast(m.n+' 위젯을 홈에 추가했습니다');
}
function removeWidget(id){
  layout=layout.filter(o=>!(o.k==='w'&&o.id===id)); renderGrid(); saveLayout();
  toast(WG_META[id].n+' 위젯을 홈에서 뺐습니다 (홈에 추가에서 다시 넣을 수 있어요)');
}
function addZone(id,rs=1,cs=3){
  if(onHomeZ(id)) return;
  const box=findFree('z',rs,cs,true) || findFree('z',rs,cs) || findFree('z',1,2,true) || findFree('z',1,2);
  if(!box){ toast('구역을 놓을 빈 자리가 없습니다'); return; }
  layout.push({...box,id}); renderGrid(); saveLayout();
  toast(zones[id].n+' 구역을 홈에 추가했습니다');
}
function removeZone(id){

  toast(zones[id].n+' 구역을 홈에서 뺐습니다 (안에 있던 앱은 그대로 남아요)');
}
function deleteZone(id){
  if(ZONES_BUILTIN[id]) return;
  const n=zones[id].n;
  layout=layout.filter(o=>!(o.k==='z'&&o.id===id)); delete zones[id];
  renderGrid(); saveLayout(); toast(n+' 구역을 삭제했습니다');
}
function renameZone(id,name){
  name=name.trim().slice(0,20); if(!name||!zones[id]) return;
  zones[id].n=name; renderGrid(); saveLayout();
}
function recolorZone(id,dot){
  if(!zones[id]||!ZONE_COLORS.includes(dot)) return;
  zones[id].dot=dot; renderGrid(); saveLayout();
}
function createZone(name,dot,cs){
  name=name.trim().slice(0,20);
  if(!name){ toast('구역 이름을 입력해 주세요'); return false; }
  const id='z_'+Date.now().toString(36);
  zones[id]={n:name, dot:ZONE_COLORS.includes(dot)?dot:ZONE_COLORS[5]};
  addZone(id,1,cs); return true;
}

    return `<div class="zrow" data-zid="${id}">

      <span class="zcolors">${ZONE_COLORS.map(c=>`<button data-zcolor="${c}" data-zid="${id}" class="${c===z.dot?'on':''}" style="background:${c}" title="색 바꾸기"></button>`).join('')}</span>
      <button class="ltg${on?' on':''}" data-ztoggle="${id}">${on?'홈 ✓':'+ 홈'}</button>
      ${ZONES_BUILTIN[id]?'':`<button class="zdel" data-zdel="${id}">삭제</button>`}
    </div>`;}).join('');
  libbody.innerHTML=`<div class="lsec"><h3>구역<span style="opacity:.6;font-weight:700">${ids.length}</span></h3>
    ${rows||'<div class="spotempty">일치하는 구역이 없습니다</div>'}</div>
    <form class="nz" id="nz"><span class="nzl">새 구역 만들기</span>
      <input id="nzName" type="text" placeholder="구역 이름 (예: 내부통제)" maxlength="20" autocomplete="off">

      <select id="nzSize"><option value="2">1 × 2 칸</option><option value="3" selected>1 × 3 칸</option><option value="4">1 × 4 칸</option></select>
      <button type="submit" class="go">추가</button>
    </form>`;
}

let memoCur=null;
function paintMemo(){
  const list=document.getElementById('memoList'); if(!list) return;
  const ta=document.getElementById('memoText'), meta=document.getElementById('memoMeta'),
        cnt=document.getElementById('memoCnt'), cols=document.getElementById('memoColors'),
        pin=document.getElementById('memoPin');
  const ms=sortedMemos();
  if(!memos.some(m=>m.id===memoCur)) memoCur=ms[0]?ms[0].id:null;
  cnt.textContent=ms.length;
  list.innerHTML=ms.length?ms.map(m=>`<button class="mi2${m.id===memoCur?' on':''}" data-mid="${m.id}">
      <span class="mdot" style="background:${STK_COLORS[m.c]||STK_COLORS.y}"></span>
      <span class="mtx"><span class="mt">${memoTitle(m)}</span>
        <span class="ms"><span class="tn">${fmtMemoTs(m.ts)}</span> ${memoBody(m)||'내용 없음'}</span></span>
      ${m.open!==false?'<span class="mpin">붙임</span>':''}</button>`).join('')
    :'<div class="mempty">메모가 없습니다. ‘+ 새 메모’로 시작하세요</div>';
  const cur=memos.find(m=>m.id===memoCur);
  if(ta.dataset.mid!==(cur?cur.id:'')){ ta.dataset.mid=cur?cur.id:''; ta.value=cur?cur.t:''; }
  ta.disabled=!cur;
  cols.innerHTML=Object.entries(STK_COLORS).map(([k,c])=>
    `<button data-mcolor="${k}" class="${cur&&(cur.c||'y')===k?'on':''}" style="background:${c}" title="색"></button>`).join('');
  meta.textContent=cur?'마지막 수정 '+new Date(cur.ts).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  pin.textContent=cur&&cur.open!==false?'바탕에서 접기':'바탕에 붙이기';
  pin.classList.toggle('on',!!cur&&cur.open!==false);
  document.querySelectorAll('.memo [data-memo="del"],.memo [data-memo="pin"]').forEach(b=>b.toggleAttribute('disabled',!cur));
}
function memoAct(a){
  const cur=memos.find(m=>m.id===memoCur);
  if(a==='new'){ const m=newSticky(); memoCur=m.id; }
  else if(a==='del'&&cur){ memos=memos.filter(m=>m!==cur); memoCur=null; toast('메모를 삭제했습니다'); }
  else if(a==='pin'&&cur){ cur.open=cur.open===false; if(cur.open) showStickies(); }
  else if(a==='showall'){ memos.forEach(m=>m.open=true); showStickies(); }
  else if(a==='hideall'){ memos.forEach(m=>m.open=false); hideStickies(); }
  else if(a==='clean'){ const n=memos.length; memos=memos.filter(m=>m.t.trim()); 
    toast(n-memos.length?`빈 메모 ${n-memos.length}개를 정리했습니다`:'빈 메모가 없습니다'); }
  saveMemos(); paintMemo(); paintStickies(); paintMemoWidget();
  if(!openMemos().length) hideStickies();
}
document.addEventListener('click',e=>{
  const a=e.target.closest('.memo [data-memo]');
  if(a){ memoAct(a.dataset.memo); return; }
  const c=e.target.closest('[data-mcolor]');
  if(c){ const m=memos.find(x=>x.id===memoCur); if(m){ m.c=c.dataset.mcolor; saveMemos(); paintMemo(); paintStickies(); } return; }
  const it=e.target.closest('[data-mid]');
  if(it){ memoCur=it.dataset.mid; paintMemo(); }
});
let memoSaveT;
document.addEventListener('input',e=>{

  cur.t=e.target.value; cur.ts=Date.now();
  clearTimeout(memoSaveT);
  memoSaveT=setTimeout(()=>{ saveMemos(); paintMemo(); paintStickies(); paintMemoWidget(); },400);
});

}

/* ══════════ 스티커 메모 동작 ══════════ */
const STK_COLORS={y:'#FFF59D',p:'#FBC8D9',g:'#CFF0C8',b:'#CFE5FF',o:'#FFD9A8'};
const stk=document.getElementById('stickies'), sboard=document.getElementById('sboard');
let stickiesOn=false, stkZ=1;
const stkRot=id=>{ let h=0; for(const ch of id) h=(h*31+ch.charCodeAt(0))>>>0; return ((h%5)-2)*0.5; };
const openMemos=()=>sortedMemos().filter(m=>m.open!==false);
function showStickies(){ stickiesOn=true; stk.classList.add('on'); paintStickies(); markDock(); if(!openMemos().length) newSticky(); }
function hideStickies(){ stickiesOn=false; stk.classList.remove('on'); markDock(); }
function toggleStickies(){ stickiesOn?hideStickies():showStickies(); }
function paintMemoWidget(){
  document.querySelectorAll('.wg[data-id="memo"]').forEach(w=>{
    const el=w.querySelector('.mlines'); if(el) el.innerHTML=memoLines();
    fitWidget(w);                              /* 내용이 바뀌면 표시 개수도 다시 맞춘다 */
  });
}
function stickyPos(m,i){
  if(!Number.isFinite(m.x)||!Number.isFinite(m.y)){ m.x=Math.max(16,VW()-300-i*34); m.y=70+i*46; }
  m.x=Math.min(Math.max(-40,m.x),Math.max(0,VW()-90)); m.y=Math.min(Math.max(0,m.y),Math.max(0,VH()-STATUS_H-50));
}
function paintStickies(){
  const open=openMemos();
  document.getElementById('stCnt').textContent=open.length;
  stkZ=Math.max(stkZ,...open.map(m=>m.z||1));
  sboard.innerHTML='';
  open.forEach((m,i)=>{
    stickyPos(m,i);
    const el=document.createElement('div'); el.className='stky'; el.dataset.sid=m.id;
    el.style.cssText=`left:${m.x}px;top:${m.y}px;--sc:${STK_COLORS[m.c]||STK_COLORS.y};--rot:${stkRot(m.id)}deg;z-index:${m.z||1}`;
    el.innerHTML=`<div class="sbar"><button class="sb" data-sact="new" title="새 메모">+</button>
      <span class="scol">${Object.entries(STK_COLORS).map(([k,c])=>`<button data-scolor="${k}" class="${(m.c||'y')===k?'on':''}" style="background:${c}" title="색 바꾸기"></button>`).join('')}</span>
      <button class="sb" data-sact="close" title="닫기 (메모는 남아요)">×</button></div>
      <textarea class="stxt" placeholder="메모를 적으세요…" spellcheck="false">${esc(m.t)}</textarea>
      <div class="sft"><span class="tn">${fmtMemoTs(m.ts)}</span><button data-sact="del">삭제</button></div>`;
    sboard.appendChild(el);
  });
}
function newSticky(from){
  const m={id:'m'+Date.now().toString(36), t:'', ts:Date.now(), c:from?(from.c||'y'):'y', open:true, z:++stkZ};
  if(from&&Number.isFinite(from.x)){ m.x=from.x+30; m.y=from.y+30; }
  memos.unshift(m); saveMemos(); paintStickies(); paintMemoWidget();
  setTimeout(()=>sboard.querySelector(`[data-sid="${m.id}"] .stxt`)?.focus(),30);
  return m;
}
const stickyOf=el=>{ const n=el.closest('.stky'); return n?memos.find(m=>m.id===n.dataset.sid):null; };
sboard.addEventListener('click',e=>{
  const m=stickyOf(e.target); if(!m) return;
  const c=e.target.closest('[data-scolor]');
  if(c){ m.c=c.dataset.scolor; saveMemos(); paintStickies(); return; }
  const a=e.target.closest('[data-sact]'); if(!a) return;
  if(a.dataset.sact==='new') newSticky(m);
  else if(a.dataset.sact==='close'){
    if(!m.t.trim()) memos=memos.filter(x=>x!==m);   /* 빈 메모는 접을 때 정리 */
    else m.open=false;
    saveMemos(); paintStickies(); paintMemoWidget(); if(!openMemos().length) hideStickies(); }
  else if(a.dataset.sact==='del'){ memos=memos.filter(x=>x!==m); saveMemos(); paintStickies(); paintMemoWidget();
    if(wins.has('memo')) paintMemo();
    toast('메모를 삭제했습니다'); if(!openMemos().length) hideStickies(); }
});
stk.addEventListener('click',e=>{
  const a=e.target.closest('.stool [data-sact]');
  if(a){ a.dataset.sact==='new'?newSticky():hideStickies(); return; }
  if(compact && !e.target.closest('.stky,.stool')) hideStickies();
});
let stkSaveT;
sboard.addEventListener('input',e=>{
  if(!e.target.classList.contains('stxt')) return;
  const m=stickyOf(e.target); if(!m) return;
  m.t=e.target.value; m.ts=Date.now();
  clearTimeout(stkSaveT);
  stkSaveT=setTimeout(()=>{ saveMemos(); paintMemoWidget(); if(wins.has('memo')) paintMemo();
    const t=e.target.closest('.stky')?.querySelector('.sft .tn'); if(t) t.textContent=fmtMemoTs(m.ts); },400);
});
/* 누르면 맨 앞으로, 윗줄을 잡고 끌면 이동 */
sboard.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.stky'); if(!el) return;
  const m=memos.find(x=>x.id===el.dataset.sid); if(!m) return;
  m.z=++stkZ; el.style.zIndex=m.z;
  sboard.querySelectorAll('.stky.top').forEach(n=>n.classList.remove('top')); el.classList.add('top');
  const bar=e.target.closest('.sbar'); if(!bar||e.target.closest('button')||compact) return;
  e.preventDefault(); bar.setPointerCapture(e.pointerId);
  const sx=e.clientX-m.x, sy=e.clientY-m.y;
  const mv=ev=>{ m.x=Math.max(-40,Math.min(ev.clientX-sx, VW()-90)); m.y=Math.max(0,Math.min(ev.clientY-sy, VH()-STATUS_H-50));
    el.style.left=m.x+'px'; el.style.top=m.y+'px'; };
  const up=()=>{ bar.releasePointerCapture(e.pointerId); bar.removeEventListener('pointermove',mv); bar.removeEventListener('pointerup',up); saveMemos(); };
  bar.addEventListener('pointermove',mv); bar.addEventListener('pointerup',up);
});

/* ══════════ 이벤트 ══════════ */
document.addEventListener('click',e=>{
  if(justDragged) return;
  const o=e.target.closest('[data-open]'); if(o){ openApp(o.dataset.open); return; }
  const d=e.target.closest('[data-dock]');
  if(d){ const id=d.dataset.dock;
    if(Date.now()-peekAt<450) return;          /* Dock을 불러낸 탭이 올라오는 아이콘에 닿는 것을 막는다 */
    if(id==='memo'){ toggleStickies(); return; }   /* Dock의 메모는 바탕의 스티커를 켜고 끈다 */
    if(wins.has(id) && wins.get(id).state!=='min' && wins.get(id).el.classList.contains('active')) minApp(id);
    else openApp(id);
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && e.target.closest && e.target.closest('.stxt')){ e.target.blur(); return; }
  if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){
    e.preventDefault(); spotOpen()?closeSpot():openSpot(); return; }
  if(spotOpen()||libOpen()) return;            /* 검색·서랍 중에는 창 단축키를 막는다 */
  if(e.key==='/' && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)){
    e.preventDefault(); openSpot(); return; }
  if((e.metaKey||e.ctrlKey)&&e.key==='4'){ e.preventDefault(); tileQuarters(); return; }
  const act=[...wins.entries()].find(([,v])=>v.el.classList.contains('active')&&v.state!=='min');
  if(!act) return;
  if(e.key==='Escape') closeApp(act[0]);
  if((e.metaKey||e.ctrlKey)&&e.key==='w'){ e.preventDefault(); closeApp(act[0]); }
  if((e.metaKey||e.ctrlKey)&&e.key==='m'){ e.preventDefault(); minApp(act[0]); }
});
addEventListener('resize',()=>{
  const wasCompact=compact;
  syncZoom();
  if(syncMode()){
    renderGrid();
    if(compact){ wins.forEach(w=>{ if(w.state!=='min') fillArea(w); }); }
    else if(wasCompact){ wins.forEach(w=>{ if(w.state==='max'&&w.restore&&w.restore.width){ Object.assign(w.el.style,w.restore); w.state='normal'; w.restore=null; paintMaxBtn([...wins.entries()].find(([,v])=>v===w)[0]); } }); }
    syncChrome();
  }
  fitWidgets(); relayoutSnaps();
  const ar=area(), fa=fullArea();
  wins.forEach((w,id)=>{
    if(w.state==='max'){ Object.assign(w.el.style,{left:fa.x+'px',top:fa.y+'px',width:fa.w+'px',height:fa.h+'px'}); return; }
    if(w.state==='snap') return;               /* 스냅 창은 relayoutSnaps가 맡는다 */
    const el=w.el;
    el.style.width=Math.min(el.offsetWidth,ar.w)+'px';
    el.style.left=Math.max(ar.x-el.offsetWidth+120,Math.min(el.offsetLeft,ar.x+ar.w-120))+'px';
    el.style.top=Math.max(ar.y-2,Math.min(el.offsetTop,ar.y+ar.h-40))+'px';
  });
});
/* 초기 배치 렌더 후 (넓은 화면에서만) 대시보드 한 창 띄워두기 — 휴대폰에서는 전체 화면 시트가 홈을 가리므로 열지 않는다 */
loadLayout(); applyTheme(theme,false);
renderGrid(); renderDock(); saveLayout();
if(!compact) openApp('aud');
</script>
