<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>샘플 21 · iPad 홈 + 창 시스템 (이동 · 크기조정)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--red:#E81A3B;--slate:#5B6E7F;--blue:#0062B8;--ok:#1F9D61;--amber:#C77414;
--ink:#1C1C1E;--txt:#3A3A3C;--txt2:#6C6C70;--txt3:#AEAEB2;--line:#E4E4E9;--line2:#F0F0F3;
--dockH:96px;--statusH:30px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'SF Pro Text','Malgun Gothic',sans-serif;
font-size:13px;color:var(--fg);-webkit-font-smoothing:antialiased;overflow:hidden;
background:var(--pageBg);touch-action:none;transition:background .3s}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.tn{font-variant-numeric:tabular-nums}
.ic{width:16px;height:16px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ══ 배경 테마 토큰 (기본: 화이트) ══ */
body{
--pageBg:#EEF1F4;
--wall:radial-gradient(1100px 800px at 15% 4%,#FFFFFF,#F2F5F8 46%,#E5EBF1);
--blob1:rgba(232,26,59,.10);--blob2:rgba(0,98,184,.10);--blob3:rgba(91,110,127,.12);
--fg:#1C1C1E;--tshadow:none;
--wgBg:rgba(255,255,255,.86);--wgBorder:rgba(20,30,45,.08);--wgShadow:0 8px 24px rgba(20,30,45,.09);
--wgFg:#1C1C1E;--wgTrack:rgba(20,30,45,.11);--wgBar:#3A3A3C;--ringFg:#1F9D61;
--chip:rgba(20,30,45,.08);--chipU:#E81A3B;--chipUFg:#fff;
--dockBg:rgba(255,255,255,.74);--dockBorder:rgba(20,30,45,.08);--dockShadow:0 10px 30px rgba(20,30,45,.16);
--dot:rgba(28,28,30,.22);--dotOn:#1C1C1E;--homebar:rgba(28,28,30,.26);
--slotB:rgba(28,28,30,.34);--slotBg:rgba(28,28,30,.05);
--dockSlotB:rgba(28,28,30,.45);--dockSlotBg:rgba(28,28,30,.07);
--btnBg:rgba(20,30,45,.06);--btnBorder:rgba(20,30,45,.11);--btnFg:rgba(28,28,30,.7);
--rszBg:rgba(20,30,45,.08);
--menuBg:rgba(252,252,253,.9);--menuBorder:rgba(20,30,45,.1);--menuShadow:0 24px 54px rgba(20,30,45,.2);
--menuHov:rgba(20,30,45,.06);--menuLine:rgba(20,30,45,.08)}
body[data-theme="mist"]{
--pageBg:#DCE5ED;
--wall:radial-gradient(1100px 850px at 20% 0%,#F8FAFC,#DBE5EE 50%,#C4D2DF);
--blob1:rgba(232,26,59,.14);--blob2:rgba(0,98,184,.16);--blob3:rgba(91,110,127,.2)}
body[data-theme="dark"]{
--pageBg:#0F1620;
--wall:radial-gradient(1200px 900px at 18% 8%,#3B4A5A,#232E3A 45%,#141C25);
--blob1:rgba(232,26,59,.42);--blob2:rgba(0,98,184,.38);--blob3:rgba(91,110,127,.55);
--fg:#fff;--tshadow:0 1px 3px rgba(0,0,0,.35);
--wgBg:rgba(18,23,30,.42);--wgBorder:rgba(255,255,255,.15);--wgShadow:0 10px 30px rgba(0,0,0,.28);
--wgFg:#fff;--wgTrack:rgba(255,255,255,.18);--wgBar:#fff;--ringFg:#5AD07A;
--chip:rgba(255,255,255,.2);--chipU:#fff;--chipUFg:#E81A3B;
--dockBg:rgba(255,255,255,.18);--dockBorder:rgba(255,255,255,.24);--dockShadow:0 12px 34px rgba(0,0,0,.3);
--dot:rgba(255,255,255,.35);--dotOn:#fff;--homebar:rgba(255,255,255,.5);
--slotB:rgba(255,255,255,.5);--slotBg:rgba(255,255,255,.12);
--dockSlotB:rgba(255,255,255,.85);--dockSlotBg:rgba(0,0,0,.22);
--btnBg:rgba(255,255,255,.14);--btnBorder:rgba(255,255,255,.2);--btnFg:rgba(255,255,255,.72);
--rszBg:rgba(255,255,255,.2);
--menuBg:rgba(26,31,38,.78);--menuBorder:rgba(255,255,255,.14);--menuShadow:0 24px 54px rgba(0,0,0,.5);
--menuHov:rgba(255,255,255,.09);--menuLine:rgba(255,255,255,.1)}

/* ══ 배경 ══ */
.wall{position:fixed;inset:0;overflow:hidden;background:var(--wall);transition:background .3s}
.wall span{position:absolute;border-radius:50%;filter:blur(100px)}
.b1{width:760px;height:600px;left:-140px;top:-120px;background:var(--blob1)}
.b2{width:820px;height:640px;right:-180px;top:12%;background:var(--blob2)}
.b3{width:700px;height:520px;left:26%;bottom:-220px;background:var(--blob3)}

/* ══ 상태 표시줄 ══ */
.status{position:fixed;top:0;left:0;right:0;height:var(--statusH);display:flex;align-items:center;
padding:0 18px 0 26px;font-size:12.5px;font-weight:700;z-index:900;color:var(--fg);
text-shadow:var(--tshadow);pointer-events:none}
.status .r{margin-left:auto;display:flex;align-items:center;gap:9px;pointer-events:auto}

/* 상태 표시줄 (조직명 + 프로필만) */
.status .sys{font-size:11px;font-weight:700;opacity:.88}

/* 사용자 프로필 — 상태 표시줄에 얹히는 형태 (드롭다운 장식 없음) */
.prof{display:flex;align-items:center;gap:6px;padding:2px 7px 2px 2px;margin-left:3px;border-radius:99px;
color:var(--fg);text-shadow:inherit;background:transparent;transition:background .15s}
.prof:hover,.prof.on{background:var(--menuHov)}
.prof:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.prof .av{width:19px;height:19px;border-radius:50%;background:linear-gradient(145deg,#FF5A72,var(--red));
color:#fff;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;
flex-shrink:0;text-shadow:none}
.prof .nm{font-size:11px;font-weight:700;letter-spacing:-.2px}

/* 프로필 드롭다운 */
.pmenu{position:fixed;top:36px;right:16px;width:268px;z-index:950;border-radius:16px;padding:6px;
background:var(--menuBg);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
border:1px solid var(--menuBorder);box-shadow:var(--menuShadow);color:var(--fg);
opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top right;pointer-events:none;
transition:opacity .16s ease,transform .16s cubic-bezier(.2,.9,.3,1.1)}
.pmenu.on{opacity:1;transform:none;pointer-events:auto}
.pmenu .card{display:flex;align-items:center;gap:11px;padding:11px 11px 12px;border-bottom:1px solid var(--menuLine);
margin-bottom:5px}
.pmenu .card .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,#FF5A72,var(--red));
color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.pmenu .card .n{font-size:13.5px;font-weight:800;letter-spacing:-.3px}
.pmenu .card .m{font-size:10.5px;opacity:.6;margin-top:2px}
.pmenu .mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;
font-size:12.5px;font-weight:600;color:var(--fg);text-align:left}
.pmenu .mi:hover{background:var(--menuHov)}
.pmenu .mi .ic{width:15px;height:15px;opacity:.6}
.pmenu .mi .n{margin-left:auto;font-size:10.5px;font-weight:800;background:var(--red);color:#fff;
min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.pmenu .mi.out{color:var(--red)}
.pmenu .mi.out .ic{opacity:.85}
.pmenu .sep{height:1px;background:var(--menuLine);margin:5px 2px}
.pmenu .lbl{padding:6px 10px 5px;font-size:9.5px;font-weight:800;letter-spacing:1.1px;opacity:.5;text-transform:uppercase}
.swatches{display:flex;gap:7px;padding:2px 8px 8px}
.sw{flex:1;height:38px;border-radius:9px;border:1.5px solid var(--menuLine);position:relative;overflow:hidden}
.sw span{position:absolute;left:5px;bottom:4px;font-size:8.5px;font-weight:800;color:#1C1C1E;
background:rgba(255,255,255,.8);border-radius:4px;padding:1px 4px}
.sw.dk span{color:#fff;background:rgba(0,0,0,.45)}
.sw.on{border-color:var(--red);box-shadow:0 0 0 2px rgba(232,26,59,.25)}

/* 토스트 */
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(10px);z-index:1500;
background:rgba(28,33,40,.9);color:#fff;font-size:12px;font-weight:600;padding:9px 16px;border-radius:99px;
box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ══ 홈 화면 ══ */
.home{position:fixed;inset:var(--statusH) 0 var(--dockH);display:grid;grid-template-columns:1.15fr 1fr;gap:34px;
padding:16px 46px 0;z-index:10;transition:transform .38s cubic-bezier(.32,.72,0,1),opacity .3s,filter .38s}
.home.pushed{transform:scale(.968);opacity:.62;filter:blur(1.2px)}
.pane{display:flex;flex-direction:column;gap:20px;min-height:0;overflow-y:auto;scrollbar-width:none}
.pane::-webkit-scrollbar{display:none}
.greet h1{font-size:26px;font-weight:800;letter-spacing:-1.1px;text-shadow:var(--tshadow)}
.greet p{font-size:12.5px;opacity:.72;margin-top:5px}

/* 위젯 그리드 — 크기 4종 (1×1 · 2×1 · 1×2 · 2×2) */
.wgrid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:192px;gap:16px;align-content:start}
.wg{border-radius:22px;padding:17px 19px;position:relative;overflow:hidden;cursor:pointer;color:var(--wgFg);
background:var(--wgBg);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
border:1px solid var(--wgBorder);box-shadow:var(--wgShadow);transition:transform .18s,background .3s,border-color .3s}
.wg:hover{transform:translateY(-2px)}
.wg[data-size="sm"],.wgrid .slot[data-size="sm"]{grid-column:span 1;grid-row:span 1}
.wg[data-size="md"],.wgrid .slot[data-size="md"]{grid-column:span 2;grid-row:span 1}
.wg[data-size="tall"],.wgrid .slot[data-size="tall"]{grid-column:span 1;grid-row:span 2}
.wg[data-size="lg"],.wgrid .slot[data-size="lg"]{grid-column:span 2;grid-row:span 2}
.wgrid .slot{border-radius:22px}
/* 크기별 표시량 */
.wg .more{display:none;margin-top:12px;padding-top:11px;border-top:1px solid var(--wgTrack)}
.wg[data-size="lg"] .more,.wg[data-size="tall"] .more{display:block}
/* 2×1에서는 행 간격을 좁혀 프로젝트 3건을 잘림 없이 담는다 */
.wg[data-size="md"] .plist{gap:6px;margin-top:8px}
.wg[data-size="md"] .pitem{grid-template-columns:24px 1fr 38px}
.wg[data-size="md"] .pitem .av{width:24px;height:24px}
.wg[data-size="sm"] .plist .pitem:nth-child(n+2),
.wg[data-size="md"] .plist .pitem:nth-child(n+4),
.wg[data-size="tall"] .plist .pitem:nth-child(n+4){display:none}
.wg[data-size="sm"] .nlist .nrow:nth-child(n+2),
.wg[data-size="md"] .nlist .nrow:nth-child(n+4),
.wg[data-size="tall"] .nlist .nrow:nth-child(n+4){display:none}
.drow{display:flex;align-items:center;gap:9px;font-size:11px;padding:4px 0}
.drow .dd{font-weight:800;font-size:11px;opacity:.9;min-width:34px}
.drow .t{opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 크기 조정 핸들 */
.wg .rsz{position:absolute;right:7px;bottom:7px;width:22px;height:22px;border-radius:7px;
display:flex;align-items:center;justify-content:center;background:var(--rszBg);color:var(--wgFg);
opacity:0;transition:opacity .15s;cursor:nwse-resize;touch-action:none}
.wg:hover .rsz{opacity:.8}
.wg .rsz:hover{opacity:1}
.wg.red .rsz{color:#fff;background:rgba(255,255,255,.24)}
.wg .rsz svg{width:11px;height:11px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.wg .szl{position:absolute;right:8px;top:8px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:99px;
background:var(--rszBg);opacity:0;transition:opacity .15s}
.wg.rz .szl{opacity:1}
.wg.rz{transform:none;outline:2px solid var(--red);outline-offset:-2px}
.wg .hd{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:800;letter-spacing:1.1px;opacity:.62;text-transform:uppercase}
.wg .hd .sq{width:15px;height:15px;border-radius:4.5px;display:flex;align-items:center;justify-content:center;font-size:6.5px;font-weight:900}
.wg.red{background:linear-gradient(150deg,#E81A3B,#B00F2C);border-color:rgba(255,255,255,.2);color:#fff}
.wg .big{font-size:36px;font-weight:800;letter-spacing:-2px;line-height:1;margin-top:10px}
.wg .big small{font-size:13px;font-weight:700;opacity:.6;margin-left:3px;letter-spacing:0}
.wg .cap{font-size:11.5px;opacity:.8;margin-top:7px;line-height:1.5}
.wg .cap b{font-weight:800;opacity:1}
.plist{margin-top:12px;display:flex;flex-direction:column;gap:11px}
.pitem{display:grid;grid-template-columns:26px 1fr 38px;gap:10px;align-items:center}
.pitem .av{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.pitem .t{font-size:11.5px;font-weight:700;letter-spacing:-.2px}
.pitem .s{font-size:9.5px;opacity:.6;margin-top:2px}
.pitem .pc{font-size:11px;font-weight:800;text-align:right}
.pbar{grid-column:2/4;height:3.5px;border-radius:3px;background:var(--wgTrack);overflow:hidden;margin-top:-4px}
.pbar i{display:block;height:100%;border-radius:3px;background:var(--wgBar)}
.ring{display:flex;align-items:center;gap:16px;margin-top:12px}
.ring svg{width:74px;height:74px;transform:rotate(-90deg)}
.ring .trk{stroke:var(--wgTrack)}
.ring .fgc{stroke:var(--ringFg)}
.ring .val{font-size:25px;font-weight:800;letter-spacing:-1.2px}
.ring .lab{font-size:10.5px;opacity:.7;margin-top:3px;line-height:1.5}
.nlist{margin-top:11px;display:flex;flex-direction:column;gap:9px}
.nrow{display:flex;align-items:center;gap:8px;font-size:11px}
.nrow .tg{font-size:8.5px;font-weight:800;padding:2px 6px;border-radius:5px;flex-shrink:0;background:var(--chip)}
.nrow .tg.u{background:var(--chipU);color:var(--chipUFg)}
.nrow .t{opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .d{margin-left:auto;opacity:.55;font-size:9.5px;flex-shrink:0}

/* 앱 아이콘 */
.apps{display:grid;grid-template-columns:repeat(5,1fr);gap:22px 12px;align-content:start;padding-top:4px}
.ap{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;
transition:transform .16s cubic-bezier(.3,1.4,.5,1);background:none}
.ap:hover{transform:scale(1.07)}
.ap:active{transform:scale(.94)}
.ap:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:14px}
.ap .icon{width:60px;height:60px;border-radius:15px;display:flex;flex-direction:column;align-items:center;
justify-content:center;font-weight:800;font-size:13.5px;letter-spacing:-.5px;position:relative;color:#fff;
box-shadow:0 6px 16px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.28)}
.ap .icon small{font-size:8px;font-weight:700;opacity:.85;margin-top:2px}
.ap .icon .bd{position:absolute;top:-5px;right:-5px;min-width:21px;height:21px;border-radius:11px;background:var(--red);
font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px;
box-shadow:0 2px 5px rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.35)}
.ap .nm{font-size:10.5px;font-weight:600;text-align:center;line-height:1.3;color:var(--fg);
text-shadow:var(--tshadow);max-width:80px}
.ap.soon .icon{opacity:.42}.ap.soon .nm{opacity:.5}

/* 아이콘 재배치 (드래그) */
.slot{border-radius:15px;border:2px dashed var(--slotB);background:var(--slotBg)}
.apps .slot{width:60px;height:60px;justify-self:center;align-self:start}
.dock .slot{width:50px;height:50px;border-radius:13px;flex-shrink:0;
border-color:var(--dockSlotB);background:var(--dockSlotBg)}
.ghost{position:fixed;z-index:2000;pointer-events:none;transform:scale(1.14);transform-origin:center;
filter:drop-shadow(0 14px 26px rgba(0,0,0,.5))}
.ghost.ap{gap:0}
.ghost.wgg{transform:scale(1.03)}
.ghost .wg{width:100%;height:100%;transform:none!important;animation:none!important}
.ghost .icon,.ghost .dk{transform:none!important;animation:none!important}
.ghost .tip{display:none}
body.editing{cursor:grabbing}
body.editing .ap,body.editing .dk{cursor:grabbing}
body.editing .ap:hover,body.editing .dk:hover{transform:none}
body.editing .dk .tip{opacity:0!important}
@keyframes jig{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
body.editing .ap .icon,body.editing .dk{animation:jig .34s ease-in-out infinite}
.reset{margin-top:9px;font-size:11px;font-weight:600;color:var(--btnFg);
background:var(--btnBg);border:1px solid var(--btnBorder);border-radius:99px;padding:5px 12px;
display:none;align-items:center;gap:6px}
.reset.show{display:inline-flex}
.reset:hover{background:var(--menuHov);color:var(--fg)}
@media (prefers-reduced-motion:reduce){body.editing .ap .icon,body.editing .dk{animation:none}}

/* 페이지 도트 */
.dots{position:fixed;bottom:98px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:15;pointer-events:none}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--dot);display:block}
.dots i.on{background:var(--dotOn)}

/* ══ Dock ══ */
.dock{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:800;display:flex;align-items:center;gap:14px;
padding:10px 16px;border-radius:26px;background:var(--dockBg);
backdrop-filter:blur(34px) saturate(180%);-webkit-backdrop-filter:blur(34px) saturate(180%);
border:1px solid var(--dockBorder);box-shadow:var(--dockShadow);transition:background .3s,border-color .3s}
.dk{width:50px;height:50px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;
color:#fff;font-size:11.5px;font-weight:800;letter-spacing:-.3px;position:relative;cursor:pointer;
box-shadow:0 4px 12px rgba(0,0,0,.26),inset 0 1px 0 rgba(255,255,255,.24);
transition:transform .17s cubic-bezier(.3,1.4,.5,1)}
.dk:hover{transform:translateY(-8px) scale(1.1)}
.dk:active{transform:translateY(-2px) scale(.96)}
.dk small{font-size:7.5px;font-weight:700;opacity:.85;margin-top:1px}
.dk .run{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;
background:rgba(255,255,255,.92);opacity:0;transition:opacity .2s}
.dk.on .run{opacity:1}
.dk .tip{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10.5px;
font-weight:600;color:#1D1D1F;background:rgba(255,255,255,.95);padding:4px 10px;border-radius:7px;
box-shadow:0 4px 14px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .15s}
.dk:hover .tip{opacity:1}
.dsep{width:1px;height:38px;background:rgba(255,255,255,.28)}
.homebar{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);width:132px;height:4.5px;border-radius:3px;
background:var(--homebar);z-index:850;pointer-events:none}

/* ══ 창 시스템 ══ */
.snap{position:fixed;z-index:400;border-radius:16px;border:2px solid rgba(255,255,255,.6);
background:rgba(255,255,255,.16);backdrop-filter:blur(6px);pointer-events:none;opacity:0;
transition:opacity .14s,left .12s,top .12s,width .12s,height .12s}
.snap.show{opacity:1}

.win{position:fixed;border-radius:14px;overflow:hidden;background:#fff;color:var(--txt);display:flex;flex-direction:column;
box-shadow:0 26px 70px rgba(0,0,0,.42),0 0 0 .5px rgba(0,0,0,.3);
animation:winIn .26s cubic-bezier(.2,.9,.3,1.1)}
@keyframes winIn{from{opacity:0;transform:scale(.9) translateY(14px)}to{opacity:1;transform:none}}
.win.closing{animation:winOut .18s ease forwards}
@keyframes winOut{to{opacity:0;transform:scale(.92)}}

const SIZE_LABEL={sm:'1 × 1',md:'2 × 1',tall:'1 × 2',lg:'2 × 2'};

const HOME_DEFAULT=['aud','k1118','fin','xbrl','ai','tax','ins','law','erp','rag','cal','rev','aqi','notice','settings'];
const DOCK_DEFAULT=['aud','k1118','fin','xbrl','ai','rev','cal','aqi'];

/* ── 배치 저장 (사용자 계정별로 이 브라우저에 보관) ── */
const resetBtn=document.getElementById('resetLayout');
const isDefault=()=>homeOrder.join()===HOME_DEFAULT.join() && dockOrder.join()===DOCK_DEFAULT.join()
  && wgOrder.join()===WG_DEFAULT.join() && WG_DEFAULT.every(id=>wgSize[id]===WG_SIZE_DEFAULT[id]);
function saveLayout(){
  resetBtn.classList.toggle('show',!isDefault());
  try{ localStorage.setItem(LKEY,JSON.stringify(
    {user:USER.mail,home:homeOrder,dock:dockOrder,wg:wgOrder,wgSize,theme})); }catch(e){}
}
function loadLayout(){
  try{
    const raw=localStorage.getItem(LKEY); if(!raw) return;
    const o=JSON.parse(raw);
    const ok=(v,M)=>Array.isArray(v)&&v.length&&v.every(id=>M[id]);
    if(ok(o.home,APPS)&&ok(o.dock,APPS)){ homeOrder=[...new Set(o.home)]; dockOrder=[...new Set(o.dock)].slice(0,DOCK_MAX); }
    if(ok(o.wg,WIDGETS)) wgOrder=[...new Set(o.wg)];
    if(o.wgSize) wgOrder.forEach(id=>{ if(SIZE_LABEL[o.wgSize[id]]) wgSize[id]=o.wgSize[id]; });
    if(THEMES[o.theme]) theme=o.theme;
  }catch(e){}
}
function resetLayout(){
  homeOrder=[...HOME_DEFAULT]; dockOrder=[...DOCK_DEFAULT];
  wgOrder=[...WG_DEFAULT]; wgSize={...WG_SIZE_DEFAULT};
  renderHome(); renderDock(); renderWidgets(); saveLayout();
  toast('홈 화면 배치를 기본값으로 되돌렸습니다');
}
resetBtn.addEventListener('click',resetLayout);

/* ══════════ 아이콘 · 위젯 드래그 재배치 ══════════ */
let drag=null, justDragged=false;
const listOf = c => c===dock ? dockOrder : c===wgrid ? wgOrder : homeOrder;
const renderOf = c => c===dock ? renderDock() : c===wgrid ? renderWidgets() : renderHome();

/* 포인터 위치가 들어갈 자리 (읽기 순서 기준) */
function indexAt(c,x,y){
  const items=[...c.querySelectorAll('[data-id]')];
  for(let i=0;i<items.length;i++){
    const r=items[i].getBoundingClientRect();
    if(y<r.bottom && x<r.left+r.width/2) return i;
  }
  return items.length;
}
function hit(el,x,y,pad){
  const r=el.getBoundingClientRect();
  return x>=r.left-pad && x<=r.right+pad && y>=r.top-pad && y<=r.bottom+pad;
}
function placeSlot(c,idx){
  const kids=[...c.querySelectorAll('[data-id]')];
  c.insertBefore(drag.slot, kids[idx]||null);
  drag.target=c;
}
function beginDrag(e,item){
  const id=item.dataset.id;
  const kind=item.classList.contains('wg')?'widget':'app';
  const from=kind==='widget'?wgrid:(item.closest('.dock')?dock:apps);
  /* 고스트로 띄울 대상: 위젯/Dock은 요소 자체, 홈 아이콘은 아이콘 사각형만 */
  const face=(kind==='widget'||from===dock)?item:item.querySelector('.icon');
  const r=face.getBoundingClientRect();

  const ghost=document.createElement('div');
  /* 홈 아이콘은 .ap 안에서만 스타일이 잡히므로 고스트에도 같은 문맥을 준다 */
  ghost.className=kind==='widget'?'ghost wgg':(from===dock?'ghost':'ghost ap');
  ghost.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
  const clone=face.cloneNode(true);
  clone.style.width=r.width+'px'; clone.style.height=r.height+'px'; clone.style.margin='0';
  ghost.appendChild(clone);
  document.body.appendChild(ghost);

  const slot=document.createElement('div'); slot.className='slot';
  if(kind==='widget') slot.dataset.size=wgSize[id]||'sm';
  const idx=listOf(from).indexOf(id);
  drag={id,kind,from,ghost,slot,target:from,
        offX:e.clientX-r.left, offY:e.clientY-r.top, homeIdx:idx};

  listOf(from).splice(idx,1);
  renderOf(from);
  placeSlot(from,idx);
  document.body.classList.add('editing');
}
function moveDrag(e){
  const {ghost}=drag;
  ghost.style.left=(e.clientX-drag.offX)+'px';
  ghost.style.top =(e.clientY-drag.offY)+'px';

  if(drag.kind==='widget'){
    if(hit(wgrid,e.clientX,e.clientY,26)) placeSlot(wgrid,indexAt(wgrid,e.clientX,e.clientY));
    else { drag.slot.remove(); drag.target=null; }
    return;
  }
  if(hit(dock,e.clientX,e.clientY,18) && dockOrder.length<DOCK_MAX){
    placeSlot(dock,indexAt(dock,e.clientX,e.clientY));
  }else if(hit(apps,e.clientX,e.clientY,24)){
    placeSlot(apps,indexAt(apps,e.clientX,e.clientY));
  }else{
    drag.slot.remove(); drag.target=null;
  }
}
function endDrag(){
  const {id,from,slot,ghost}=drag;
  let c=drag.target, idx;
  if(c && slot.parentNode===c){
    idx=[...c.children].filter(n=>n.dataset.id||n===slot).indexOf(slot);
  }else{ c=from; idx=drag.homeIdx; }          /* 밖에 놓으면 원래 자리로 */
  const list=listOf(c);
  const dup=list.indexOf(id);                 /* 다른 쪽에 이미 있던 앱이면 '이동'으로 처리 */
  if(dup>-1){ list.splice(dup,1); if(dup<idx) idx--; }
  list.splice(idx,0,id);
  slot.remove(); ghost.remove();
  document.body.classList.remove('editing');
  drag=null;
  renderHome(); renderDock(); renderWidgets(); saveLayout();
  justDragged=true; setTimeout(()=>justDragged=false,0);
}
/* ── 위젯 크기 조정 (모서리 핸들을 끌면 1×1 · 2×1 · 1×2 · 2×2로 스냅) ── */
function startResize(e,handle){
  const el=handle.closest('.wg'), id=el.dataset.id;
  const g=wgrid.getBoundingClientRect(), r=el.getBoundingClientRect();
  const GAP=16, ROW=192, COL=(g.width-GAP)/2;
  const x0=r.left, y0=r.top, before=wgSize[id];
  el.classList.add('rz');
  handle.setPointerCapture(e.pointerId);
  const move=ev=>{
    ev.preventDefault();
    const cols=Math.min(2,Math.max(1,Math.ceil((ev.clientX-x0+GAP/2)/(COL+GAP))));
    const rows=Math.min(2,Math.max(1,Math.ceil((ev.clientY-y0+GAP/2)/(ROW+GAP))));
    const size=cols===1?(rows===1?'sm':'tall'):(rows===1?'md':'lg');
    if(size!==wgSize[id]){
      wgSize[id]=size; el.dataset.size=size;
      el.querySelector('.szl').textContent=SIZE_LABEL[size];
    }
  };
  const up=()=>{
    handle.removeEventListener('pointermove',move);
    handle.removeEventListener('pointerup',up);
    handle.removeEventListener('pointercancel',up);
    el.classList.remove('rz');
    if(wgSize[id]!==before) saveLayout();
    justDragged=true; setTimeout(()=>justDragged=false,0);
  };
  handle.addEventListener('pointermove',move);
  handle.addEventListener('pointerup',up);
  handle.addEventListener('pointercancel',up);
}

document.addEventListener('pointerdown',e=>{
  const rsz=e.target.closest('.rsz');
  if(rsz){ e.preventDefault(); e.stopPropagation(); startResize(e,rsz); return; }
  const item=e.target.closest('.ap[data-id],.dk[data-id],.wg[data-id]');
  if(!item||e.button) return;
  const sx=e.clientX, sy=e.clientY;
  let started=false;
  const move=ev=>{
    if(!started){
      if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)<6) return;
      started=true; beginDrag(ev,item);
    }
    ev.preventDefault(); moveDrag(ev);
  };
  const up=()=>{
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',up);
    document.removeEventListener('pointercancel',up);
    if(started) endDrag();
  };
  document.addEventListener('pointermove',move);
  document.addEventListener('pointerup',up);
  document.addEventListener('pointercancel',up);
});


/* ══════════ 창 시스템 ══════════ */
const wins=new Map();            // id -> {el, state, restore}
let zTop=100, cascade=0;
const snapEl=document.getElementById('snap');
const homeEl=document.getElementById('home');
const MIN_W=320, MIN_H=220, EDGE=10;
const area=()=>({x:8, y:36, w:innerWidth-16, h:innerHeight-36-88});

function syncHome(){
  const open=[...wins.values()].some(w=>w.state!=='min');
  homeEl.classList.toggle('pushed',open);
}
function markDock(){
  document.querySelectorAll('[data-dock]').forEach(d=>d.classList.toggle('on', wins.has(d.dataset.dock)));
}
function focusWin(id){
  const w=wins.get(id); if(!w) return;
  w.el.style.zIndex=++zTop;
  wins.forEach((v,k)=>v.el.classList.toggle('active',k===id));
}
/* 남아 있는 창 중 가장 위의 창으로 포커스 이동 */
function focusTop(){
  let top=null,tz=-1;
  wins.forEach((v,k)=>{ if(v.state==='min') return;
    const z=+v.el.style.zIndex||0; if(z>tz){tz=z;top=k;} });
  wins.forEach(v=>v.el.classList.remove('active'));
  if(top) focusWin(top);
}
function openApp(id){
  const a=APPS[id]; if(!a) return;
  if(wins.has(id)){
    const w=wins.get(id);
    if(w.state==='min'){ w.el.style.display='flex'; w.el.classList.remove('min'); w.state='normal'; }
    focusWin(id); syncHome(); return;
  }
  const ar=area();
  const w=Math.min(a.w||720, ar.w-40), h=Math.min(a.h||520, ar.h-30);
  const off=(cascade++%6)*28;
  let x=ar.x+Math.max(20,(ar.w-w)/2-120)+off, y=ar.y+Math.max(14,(ar.h-h)/2-30)+off;
  x=Math.min(x, ar.x+ar.w-w-10); y=Math.min(y, ar.y+ar.h-h-10);

  const el=document.createElement('div');
  el.className='win active';
  el.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;z-index:${++zTop}`;
  el.innerHTML=`
    <div class="wtb">
      <div class="tt"><span class="mk" style="background:${a.bg};${id==='cal'?'color:#1D1D1F':''}">${a.short.slice(0,4)}</span>
        <span class="n">${a.name}</span><span class="s">${a.sub||''}</span></div>
      <div class="wctl">
        <button data-act="min" title="최소화" aria-label="최소화"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
        <button data-act="max" title="최대화" aria-label="최대화"><svg viewBox="0 0 12 12"><rect x="2.4" y="2.4" width="7.2" height="7.2"/></svg></button>
        <button class="close" data-act="close" title="닫기" aria-label="닫기"><svg viewBox="0 0 12 12"><path d="M2.6 2.6l6.8 6.8M9.4 2.6l-6.8 6.8"/></svg></button>
      </div>
    </div>
    <div class="wbody">${a.body?a.body():`
      <div class="empty"><div class="bigicon" style="background:${a.bg}">${a.short}</div>
      <div class="t">${a.name}</div>
      <div class="d">${a.soon?'아직 준비 중인 App입니다. 오픈 시 이 창에서 바로 실행됩니다.':'구독 App입니다. 외부 서비스 창이 이 자리에 임베드됩니다.'}<br>${a.sub}</div></div>`}</div>
    ${['n','s','w','e','nw','ne','sw','se'].map(d=>`<div class="rs ${d}" data-rs="${d}"></div>`).join('')}`;
  document.body.appendChild(el);
  syncThemeUI();                              /* 설정 창의 배경 카드 선택 상태 반영 */
  wins.set(id,{el,state:'normal',restore:null});
  bindWindow(id,el);
  focusWin(id); markDock(); syncHome();
}
function closeApp(id){
  const w=wins.get(id); if(!w) return;
  w.el.classList.add('closing');
  setTimeout(()=>{w.el.remove(); wins.delete(id); markDock(); syncHome(); focusTop();},170);
}
function minApp(id){
  const w=wins.get(id); if(!w) return;
  w.el.classList.add('min'); w.state='min';
  w.el.classList.remove('active');
  setTimeout(()=>{ if(w.state==='min') w.el.style.display='none'; },210);
  syncHome(); focusTop();
}
function maxApp(id){
  const w=wins.get(id); if(!w) return;
  const el=w.el, ar=area();
  el.classList.add('snapping');
  if(w.state==='max' && w.restore){
    Object.assign(el.style,w.restore); w.state='normal'; w.restore=null;
  }else{
    w.restore={left:el.style.left,top:el.style.top,width:el.style.width,height:el.style.height};
    Object.assign(el.style,{left:ar.x+'px',top:ar.y+'px',width:ar.w+'px',height:ar.h+'px'});
    w.state='max';
  }
  setTimeout(()=>el.classList.remove('snapping'),200);
  paintMaxBtn(id);
}
/* 최대화 상태면 '이전 크기로 복원' 아이콘(겹친 사각형)으로 바꿈 */
const ICON_MAX='<svg viewBox="0 0 12 12"><rect x="2.4" y="2.4" width="7.2" height="7.2"/></svg>';
const ICON_RESTORE='<svg viewBox="0 0 12 12"><rect x="2" y="4" width="6" height="6"/><path d="M4.2 4V2h5.8v5.8H8"/></svg>';
function paintMaxBtn(id){
  const w=wins.get(id); if(!w) return;
  const b=w.el.querySelector('[data-act="max"]'); if(!b) return;
  const on=w.state==='max';
  b.innerHTML=on?ICON_RESTORE:ICON_MAX;
  b.title=b.ariaLabel=on?'이전 크기로':'최대화';
}
function snapTo(id,rect){
  const w=wins.get(id); if(!w) return;
  if(w.state!=='max' && !w.restore) w.restore={left:w.el.style.left,top:w.el.style.top,width:w.el.style.width,height:w.el.style.height};
  w.el.classList.add('snapping');
  Object.assign(w.el.style,{left:rect.x+'px',top:rect.y+'px',width:rect.w+'px',height:rect.h+'px'});
  w.state='snap';
  setTimeout(()=>w.el.classList.remove('snapping'),200);
}
function zoneRect(zone){
  const a=area();
  if(zone==='max') return a;
  if(zone==='left') return {x:a.x,y:a.y,w:a.w/2-4,h:a.h};
  if(zone==='right') return {x:a.x+a.w/2+4,y:a.y,w:a.w/2-4,h:a.h};
  return null;
}

function bindWindow(id,el){
  const w=wins.get(id);
  el.addEventListener('pointerdown',()=>focusWin(id),true);

  /* 트래픽 라이트 */
  el.querySelector('.wctl').addEventListener('click',e=>{
    const b=e.target.closest('[data-act]'); if(!b) return;
    e.stopPropagation();
    ({close:closeApp,min:minApp,max:maxApp})[b.dataset.act](id);
  });

  /* 타이틀바 드래그 + 스냅 */
  const tb=el.querySelector('.wtb');
  tb.addEventListener('dblclick',()=>maxApp(id));
  tb.addEventListener('pointerdown',e=>{
    if(e.target.closest('.wctl')) return;
    e.preventDefault(); tb.setPointerCapture(e.pointerId);
    let sx=e.clientX, sy=e.clientY;
    let ox=el.offsetLeft, oy=el.offsetTop, moved=false, zone=null;

    const move=ev=>{
      const dx=ev.clientX-sx, dy=ev.clientY-sy;
      if(!moved && Math.abs(dx)+Math.abs(dy)<3) return;
      /* 최대화·스냅 상태에서 끌면 원래 크기로 복귀하며 커서를 따라감 */
      if(!moved && (w.state==='max'||w.state==='snap') && w.restore){
        const rw=parseFloat(w.restore.width);
        Object.assign(el.style,{width:w.restore.width,height:w.restore.height});
        ox=ev.clientX-rw/2; oy=ev.clientY-20; sx=ev.clientX; sy=ev.clientY;
        w.state='normal'; w.restore=null;
      }
      moved=true;
      const ar=area();
      let nx=ox+(ev.clientX-sx), ny=oy+(ev.clientY-sy);
      nx=Math.max(ar.x-el.offsetWidth+120, Math.min(nx, ar.x+ar.w-120));
      ny=Math.max(ar.y-2, Math.min(ny, ar.y+ar.h-40));
      el.style.left=nx+'px'; el.style.top=ny+'px';

      zone = ev.clientY<=area().y+6 ? 'max' : ev.clientX<=EDGE ? 'left' : ev.clientX>=innerWidth-EDGE ? 'right' : null;
      const r=zone&&zoneRect(zone);
      if(r){ Object.assign(snapEl.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'});
             snapEl.classList.add('show'); }
      else snapEl.classList.remove('show');
    };
    const up=ev=>{
      tb.releasePointerCapture(e.pointerId);
      tb.removeEventListener('pointermove',move); tb.removeEventListener('pointerup',up);
      snapEl.classList.remove('show');
      if(zone==='max') maxApp(id);
      else if(zone) snapTo(id,zoneRect(zone));
    };
    tb.addEventListener('pointermove',move); tb.addEventListener('pointerup',up);
  });

  /* 8방향 리사이즈 */
  el.querySelectorAll('[data-rs]').forEach(h=>{
    h.addEventListener('pointerdown',e=>{
      e.preventDefault(); e.stopPropagation(); h.setPointerCapture(e.pointerId);
      const dir=h.dataset.rs, sx=e.clientX, sy=e.clientY;
      const ox=el.offsetLeft, oy=el.offsetTop, ow=el.offsetWidth, oh=el.offsetHeight;
      const ar=area();
      if(w.state!=='normal'){ w.state='normal'; w.restore=null; }
      const move=ev=>{
        const dx=ev.clientX-sx, dy=ev.clientY-sy;
        let x=ox,y=oy,ww=ow,hh=oh;
        if(dir.includes('e')) ww=Math.max(MIN_W,Math.min(ow+dx, ar.x+ar.w-ox));
        if(dir.includes('s')) hh=Math.max(MIN_H,Math.min(oh+dy, ar.y+ar.h-oy));
        if(dir.includes('w')){ ww=Math.max(MIN_W,Math.min(ow-dx, ox+ow-ar.x)); x=ox+ow-ww; }
        if(dir.includes('n')){ hh=Math.max(MIN_H,Math.min(oh-dy, oy+oh-ar.y)); y=oy+oh-hh; }
        Object.assign(el.style,{left:x+'px',top:y+'px',width:ww+'px',height:hh+'px'});
      };
      const up=()=>{ h.releasePointerCapture(e.pointerId);
        h.removeEventListener('pointermove',move); h.removeEventListener('pointerup',up); };
      h.addEventListener('pointermove',move); h.addEventListener('pointerup',up);
    });
  });
}

/* ══════════ 프로필 메뉴 · 토스트 · 배경 ══════════ */
const profBtn=document.getElementById('profBtn'), pmenu=document.getElementById('pmenu'),
      toastEl=document.getElementById('toast'), swatches=document.getElementById('swatches');
let toastT;
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('on'),2200);
}
function menu(open){
  pmenu.classList.toggle('on',open);
  profBtn.classList.toggle('on',open);
  profBtn.setAttribute('aria-expanded',open);
}
swatches.innerHTML=Object.entries(THEMES).map(([k,t])=>
  `<button class="sw ${k}${k==='dark'?' dk':''}" data-theme-opt="${k}" title="${t.n}"><span>${t.n}</span></button>`).join('');

profBtn.addEventListener('click',e=>{ e.stopPropagation(); menu(!pmenu.classList.contains('on')); });
document.addEventListener('click',e=>{
  const opt=e.target.closest('[data-theme-opt]');
  if(opt){ applyTheme(opt.dataset.themeOpt); toast(THEMES[theme].n+' 배경으로 바꿨습니다'); return; }
  if(e.target.closest('[data-reset]')){ resetLayout(); return; }
  const mi=e.target.closest('[data-mact]');
  if(mi){
    menu(false);
    const a=mi.dataset.mact;
    if(a==='settings'||a==='profile') openApp('settings');
    else if(a==='notice') openApp('notice');
    else if(a==='help') toast('도움말은 준비 중입니다');
    else if(a==='logout') toast(USER.name+' 님, 로그아웃되었습니다 (프로토타입)');
    return;
  }
  if(!e.target.closest('#pmenu,#profBtn')) menu(false);
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') menu(false); });

/* ══════════ 이벤트 ══════════ */
document.addEventListener('click',e=>{
  if(justDragged) return;
  const o=e.target.closest('[data-open]'); if(o){ openApp(o.dataset.open); return; }
  const d=e.target.closest('[data-dock]');
  if(d){ const id=d.dataset.dock;
    if(wins.has(id) && wins.get(id).state!=='min' && wins.get(id).el.classList.contains('active')) minApp(id);
    else openApp(id);
  }
});
document.addEventListener('keydown',e=>{
  const act=[...wins.entries()].find(([,v])=>v.el.classList.contains('active')&&v.state!=='min');
  if(!act) return;
  if(e.key==='Escape') closeApp(act[0]);
  if((e.metaKey||e.ctrlKey)&&e.key==='w'){ e.preventDefault(); closeApp(act[0]); }
  if((e.metaKey||e.ctrlKey)&&e.key==='m'){ e.preventDefault(); minApp(act[0]); }
});
addEventListener('resize',()=>{
  const ar=area();
  wins.forEach((w,id)=>{
    if(w.state==='max'){ Object.assign(w.el.style,{left:ar.x+'px',top:ar.y+'px',width:ar.w+'px',height:ar.h+'px'}); return; }
    const el=w.el;
    el.style.width=Math.min(el.offsetWidth,ar.w)+'px';
    el.style.left=Math.max(ar.x-el.offsetWidth+120,Math.min(el.offsetLeft,ar.x+ar.w-120))+'px';
    el.style.top=Math.max(ar.y-2,Math.min(el.offsetTop,ar.y+ar.h-40))+'px';
  });
});
/* 초기 배치 렌더 후 대시보드 한 창 띄워두기 */
loadLayout(); applyTheme(theme,false);
renderHome(); renderDock(); renderWidgets(); saveLayout();
openApp('aud');
</script>
