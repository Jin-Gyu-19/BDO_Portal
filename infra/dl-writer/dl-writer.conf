# ============================================================
#  dl-writer — /downloads/ · /layouts/ 쓰기(PUT/DELETE) 전용
#  NAS 경로: /volume1/sh-pf/docker/sh-platform/dl-writer/dl-writer.conf
#  메인 nginx(sso/nginx-default.conf 의 /_dlw/downloads/)가 관리자 확인을 마친 요청만 넘긴다.
#  이 서버는 loopback 에서만 듣고, GET 은 받지 않는다(읽기는 메인 nginx 가 함).
# ============================================================
server {
    listen 127.0.0.1:4181;
    server_name _;
    access_log /var/log/nginx/dl-writer.log;

    location /downloads/ {
        root /srv;                                   # → /srv/downloads/<파일명>
        limit_except PUT DELETE { deny all; }        # PUT·DELETE 외에는 403
        if ($uri ~ "^/downloads/(.*/|\.|$)") { return 403; }   # 하위 폴더·숨김 파일·폴더 자체 거부
        client_max_body_size 500m;
        dav_methods PUT DELETE;
        dav_access user:rw group:rw all:r;
        create_full_put_path off;
    }
    # 내 홈 배치(계정별 파일) — 메인 nginx 가 /_lw/layouts/<계정>.json 으로만 보낸다 (2026-09-20)
    location /layouts/ {
        root /srv;                                   # → /srv/layouts/<계정>.json
        limit_except PUT DELETE { deny all; }
        if ($uri ~ "^/layouts/(.*/|\.|$)") { return 403; }   # 하위 폴더·숨김 파일·폴더 자체 거부
        client_max_body_size 2m;
        dav_methods PUT DELETE;
        dav_access user:rw group:rw all:r;
        create_full_put_path off;
    }
    location / { return 403; }
}
